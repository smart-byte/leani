config_version = 1
data_dir = "/var/lib/leani"

[chain]
name = "ethereum-mainnet"
chain_id = 1

[budgets]
memory_bytes = 1073741824
temporary_disk_bytes = 536870912
pending_delta_bytes = 536870912
recent_raw_soft_bytes = 536870912
recent_raw_hard_bytes = 1073741824
source_concurrency = 4
mapper_concurrency = 4

[budgets.delivery]
maximum_retained_bytes = "1536MiB"
maximum_history_retained_bytes = "1GiB"

[budgets.store]
maximum_physical_bytes = "2GiB"

[[sources.history]]
id = "xatu"
kind = "xatu"
priority = 10
trust = "trusted_dataset"

[sources.live]
kind = "disabled"
minimum_peers = 0
handoff_overlap_blocks = 32

[finality]
kind = "disabled"
checkpoint = ""
endpoints = []
minimum_agreement = 1

[[processors]]
id = "blobs-money"
instance = "blobs-container"
version = "1.4.0"
start_block = 19426589
publish = "included_and_finalized"

[processors.state]
mode = "checkpointed"

[processors.output]
mode = "full"

[processors.delivery]
mode = "window"

[processors.checkpoint]
mode = "automatic"
keep = 3

[processors.undo]
mode = "unfinalized"
safety_blocks = 256

[processors.coverage]
verification_segment_blocks = 8192

[rpc]
http_bind = "0.0.0.0:8545"
ws_bind = "0.0.0.0:8546"
historical_mode = "on_demand"
transaction_locator = false
minimum_recent_blocks = 128

[api]
bind = "0.0.0.0:8080"
