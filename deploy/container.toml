config_version = 1
data_dir = "/var/lib/leani"

[chain]
name = "ethereum-mainnet"
chain_id = 1

[budgets]
memory_bytes = 1073741824
temporary_disk_bytes = 536870912
pending_delta_bytes = 536870912
recent_raw_soft_bytes = 536870912
recent_raw_hard_bytes = 1073741824
source_concurrency = 4
mapper_concurrency = 4

[budgets.delivery]
maximum_retained_bytes = "1536MiB"
maximum_history_retained_bytes = "1GiB"

[budgets.store]
maximum_physical_bytes = "2GiB"

[[sources.history]]
id = "xatu"
kind = "xatu"
priority = 10
trust = "trusted_dataset"

[sources.live]
kind = "disabled"
minimum_peers = 0
handoff_overlap_blocks = 32

[finality]
kind = "disabled"
checkpoint = ""
endpoints = []
minimum_agreement = 1

[[processors]]
id = "blobs-money"
instance = "blobs-container"
version = "1.5.0"
start_block = 19426589
publish = "included_and_finalized"

[processors.state]
mode = "checkpointed"

[processors.output]
mode = "full"

[processors.delivery]
mode = "window"

[processors.checkpoint]
mode = "automatic"
keep = 3

[processors.undo]
mode = "unfinalized"
safety_blocks = 256

[processors.coverage]
verification_segment_blocks = 8192

[rpc]
http_bind = "0.0.0.0:8545"
ws_bind = "0.0.0.0:8546"
historical_mode = "on_demand"
minimum_recent_blocks = 128
# JSON-RPC has no authentication. The container listens on all of its
# interfaces so published ports work; compose.yaml publishes them on host
# loopback only. Publish them further only behind an authenticating proxy.
allow_unauthenticated_remote = true

[api]
bind = "0.0.0.0:8080"
# `serve` refuses to start unless LEANI_API_TOKEN holds at least 16
# printable ASCII characters without spaces, for example from
# `openssl rand -hex 32`.
bearer_token_env = "LEANI_API_TOKEN"
# The compose service name, so other services can call http://leani:8080.
# Add every other name clients use to reach the API; the API answers other
# Host names with 421.
allowed_hosts = ["leani"]
