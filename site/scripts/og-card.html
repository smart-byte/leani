<!doctype html>
<!--
  Source of public/og-image.png, the 1200×630 social share card.
  After editing, render it from site/ with any headless Chromium, e.g.:
    chrome-headless-shell --headless --hide-scrollbars --window-size=1200,630 \
      --virtual-time-budget=3000 --screenshot=public/og-image.png \
      "file://$PWD/scripts/og-card.html"
  Fonts load from node_modules, so run `bun install` first.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Inter'; font-weight: 100 900; src: url('../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 400; src: url('../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 700; src: url('../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-700-normal.woff2') format('woff2'); }
  * { box-sizing: border-box; }
  body { margin: 0; }
  .card { width: 1200px; height: 630px; position: relative; overflow: hidden; padding: 64px; background: #0b0f0d; color: #e6f0ea; font-family: 'Inter', sans-serif; }
  .grid { position: absolute; inset: 0; opacity: .55; background-size: 48px 48px; background-image: linear-gradient(#16201b 1px, transparent 1px), linear-gradient(90deg, #16201b 1px, transparent 1px); }
  .top { position: relative; display: flex; justify-content: space-between; align-items: center; }
  .brand { display: flex; align-items: center; gap: 14px; font: 700 30px 'JetBrains Mono', monospace; }
  .brand svg { width: 48px; height: 48px; display: block; }
  .accent { color: #3ee07f; }
  .url { font: 400 22px 'JetBrains Mono', monospace; color: #8fa89a; }
  h1 { position: relative; max-width: 860px; margin: 52px 0 0; font-size: 58px; font-weight: 800; line-height: 1.06; letter-spacing: -0.03em; }
  .flow { position: absolute; left: 64px; right: 64px; bottom: 56px; height: 200px; }
  .flow svg { width: 100%; height: 100%; overflow: visible; }
  .num { font: 400 16px 'JetBrains Mono', monospace; fill: #3ee07f; }
  .step { font: 700 24px 'JetBrains Mono', monospace; fill: #e6f0ea; }
  .caption { font: 400 17px 'Inter', sans-serif; fill: #8fa89a; }
</style>
</head>
<body>
<div class="card">
  <div class="grid"></div>
  <div class="top">
    <div class="brand">
      <svg viewBox="0 0 256 256" aria-hidden="true"><rect width="256" height="256" rx="48" fill="#242625"/><g transform="translate(-38 -10.5)" fill="#3ee07f"><rect x="84" y="56" width="18" height="18" rx="4"/><rect x="106" y="56" width="18" height="18" rx="4"/><rect x="84" y="78" width="18" height="18" rx="4"/><rect x="106" y="78" width="18" height="18" rx="4"/><path d="M104 104v56c0 23 18 41 41 41h35" fill="none" stroke="#3ee07f" stroke-width="40" stroke-linejoin="round"/><circle cx="180" cy="201" r="20"/><circle cx="228" cy="201" r="20"/></g></svg>
      <span><span class="accent">leani</span>_</span>
    </div>
    <div class="url">leani.dev</div>
  </div>
  <h1>Keep only the Ethereum data your app needs.</h1>
  <div class="flow">
    <svg viewBox="0 0 1072 200" aria-hidden="true">
      <g fill="#3ee07f">
        <rect x="0" y="0" width="26" height="26" rx="6"/><rect x="32" y="0" width="26" height="26" rx="6"/>
        <rect x="0" y="32" width="26" height="26" rx="6"/><rect x="32" y="32" width="26" height="26" rx="6"/>
      </g>
      <path d="M29 76 V112 C29 132 45 146 65 146 H1010" fill="none" stroke="#3ee07f" stroke-width="18" stroke-linecap="round"/>
      <circle cx="1046" cy="146" r="20" fill="#3ee07f"/>
      <text class="num" x="150" y="92">01</text><text class="step" x="150" y="122">acquire</text>
      <text class="num" x="380" y="92">02</text><text class="step" x="380" y="122">validate</text>
      <text class="num" x="610" y="92">03</text><text class="step" x="610" y="122">reduce</text>
      <text class="num" x="840" y="92">04</text><text class="step" x="840" y="122">deliver</text>
      <text class="caption" x="150" y="190">history + live head</text>
      <text class="caption" x="380" y="190">light-client verified</text>
      <text class="caption" x="610" y="190">your processors</text>
      <text class="caption" x="840" y="190">API, SDK, JSON-RPC</text>
    </svg>
  </div>
</div>
</body>
</html>
