<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 164" width="660" height="164" role="img" aria-labelledby="title desc">
  <title id="title">Coverage and finality are separate</title>
  <desc id="desc">A processor requested blocks 100 to 140. Its coverage is 100 to 112 and 120 to 140, so blocks 113 to 119 are missing and coverage is not complete. Independently, the chain is finalized through block 128 and blocks 129 to 140 are included but not yet finalized.</desc>
  <defs>
    <pattern id="gap" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>

  <!-- block b sits at x = 140 + (b - 100) * 12.5 -->
  <line class="rule" x1="290" y1="14" x2="290" y2="150"/>
  <line class="rule" x1="390" y1="14" x2="390" y2="150"/>

  <text x="24" y="37">requested</text>
  <rect class="open" x="140" y="20" width="500" height="26" rx="5"/>
  <text class="s d" x="150" y="37">100</text>
  <text class="s d" x="630" y="37" text-anchor="end">140</text>

  <text x="24" y="79">coverage</text>
  <text class="s h" x="24" y="96">complete: false</text>
  <rect class="box" x="140" y="62" width="150" height="26" rx="5"/>
  <text class="s" x="150" y="79">100</text>
  <text class="s" x="280" y="79" text-anchor="end">112</text>
  <rect class="boxh" x="290" y="62" width="100" height="26"/>
  <rect x="290" y="62" width="100" height="26" fill="url(#gap)"/>
  <text class="s h b" x="340" y="79" text-anchor="middle">113–119</text>
  <rect class="box" x="390" y="62" width="250" height="26" rx="5"/>
  <text class="s" x="400" y="79">120</text>
  <text class="s" x="630" y="79" text-anchor="end">140</text>

  <text x="24" y="131">finality</text>
  <rect class="boxa" x="140" y="114" width="350" height="26" rx="5"/>
  <text class="s" x="150" y="131">100</text>
  <text class="s a b" x="315" y="131" text-anchor="middle">finalized</text>
  <text class="s" x="480" y="131" text-anchor="end">128</text>
  <rect class="opena" x="502" y="114" width="138" height="26" rx="5"/>
  <text class="s" x="512" y="131">129</text>
  <text class="s a" x="571" y="131" text-anchor="middle">included</text>
  <text class="s" x="630" y="131" text-anchor="end">140</text>
</svg>
