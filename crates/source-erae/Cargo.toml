[package]
name = "leani-source-erae"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
# Bulk transaction backfills need native signature recovery. Enabling the
# primitives backend alone does not select Alloy consensus's recovery backend.
alloy-consensus = { workspace = true, features = ["secp256k1"] }
alloy-eips.workspace = true
alloy-primitives.workspace = true
alloy-rlp.workspace = true
async-trait.workspace = true
futures.workspace = true
hex.workspace = true
leani-primitives = { path = "../primitives" }
leani-source-api = { path = "../source-api" }
postcard.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
reth-era.workspace = true
reth-ethereum-primitives.workspace = true
serde.workspace = true
snap.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
url.workspace = true

[dev-dependencies]
blake3.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
