services:
  leani:
    build:
      context: .
    restart: unless-stopped
    init: true
    # `serve` takes up to 15 seconds to stop; Docker's default allows 10.
    stop_grace_period: 30s
    # The image's /etc/leani/node.toml (deploy/container.toml) reads the API
    # bearer token from LEANI_API_TOKEN; `serve` refuses to start unless it
    # holds at least 16 printable ASCII characters. Export it before any
    # `docker compose` command: Compose resolves it for the whole file.
    # That file also lists this service's name, `leani`, in api.allowed_hosts,
    # so other services can call http://leani:8080. To add the host names your
    # clients use, mount your own copy over /etc/leani/node.toml.
    environment:
      LEANI_API_TOKEN: ${LEANI_API_TOKEN:?set LEANI_API_TOKEN to a random value of at least 16 characters}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8545:8545"
      - "127.0.0.1:8546:8546"
    volumes:
      - leani-data:/var/lib/leani
      - type: tmpfs
        target: /tmp/leani
        tmpfs:
          size: 536870912
    deploy:
      resources:
        limits:
          memory: 2G
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true

  benchmark-postgres:
    image: postgres:17-alpine
    profiles: ["benchmark"]
    environment:
      POSTGRES_DB: leani_benchmark
      POSTGRES_USER: leani_benchmark
      POSTGRES_PASSWORD: leani_benchmark
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leani_benchmark -d leani_benchmark"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  leani-data:
