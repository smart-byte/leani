# Reproducible fixed-range Mainnet benchmark profile. The benchmark command
# replaces the selected processor lifecycle with externalized delivery while
# preserving its processor identity and settings.
config_version = 1
data_dir = "./data/benchmark-real-source"

[chain]
name = "ethereum-mainnet"
chain_id = 1

[budgets]
memory_bytes = 1073741824
temporary_disk_bytes = 4294967296
pending_delta_bytes = 536870912
recent_raw_soft_bytes = 536870912
recent_raw_hard_bytes = 1073741824
source_concurrency = 4
mapper_concurrency = 4

[budgets.delivery]
maximum_retained_bytes = "1536MiB"
maximum_history_retained_bytes = "1GiB"

[budgets.store]
maximum_physical_bytes = "4GiB"

[budgets.artifacts]
maximum_retained_bytes = "1GiB"
maximum_pending_bytes = "256MiB"

[budgets.history_pipeline]
maximum_active_chunks = 4
maximum_mapped_bytes = "256MiB"

[budgets.history_pipeline.commit]
maximum_blocks = 128
maximum_changes = 10000
maximum_encoded_bytes = "16MiB"
maximum_delay = "50ms"
target_writer_hold = "20ms"

[[sources.history]]
id = "xatu"
kind = "xatu"
priority = 10
trust = "trusted_dataset"
chunk_blocks = 1000
blobs_chunk_blocks = 8000
batch_rows = 8192

[[sources.history]]
id = "erae"
kind = "era_e"
priority = 20
trust = "trusted_dataset"
endpoint = "https://data.ethpandaops.io/erae/mainnet/"

[sources.live]
kind = "disabled"
minimum_peers = 0

[finality]
kind = "disabled"
checkpoint = ""

[[processors]]
id = "blobs-money"
instance = "benchmark-blobs-externalized"
version = "1.4.0"
history_control = "node_owned"
history_mode = "on_demand"
start_block = 19426589
publish = "finalized_only"

[processors.state]
mode = "durable"

[processors.artifacts]
mode = "none"

[processors.output]
mode = "full"
finalized_only = true

[processors.delivery]
mode = "none"

[processors.checkpoint]
mode = "automatic"
keep = 3

[processors.undo]
mode = "none"
safety_blocks = 0

[processors.coverage]
verification_segment_blocks = 8192

[[processors]]
id = "uniswap-observations"
instance = "benchmark-uniswap-v3-weth-usdc-externalized"
version = "2.1.0"
history_control = "node_owned"
history_mode = "on_demand"
start_block = 12376729
publish = "finalized_only"

[processors.state]
mode = "durable"

[processors.artifacts]
mode = "none"

[processors.output]
mode = "full"
finalized_only = true

[processors.delivery]
mode = "none"

[processors.checkpoint]
mode = "automatic"
keep = 3

[processors.undo]
mode = "none"
safety_blocks = 0

[processors.coverage]
verification_segment_blocks = 8192

[processors.settings]

[[processors.settings.pools]]
address = "0x88e6A0c2dDD26FEEb64F039a2c41296FcB3f5640"
kind = "v3"

[rpc]
http_bind = "127.0.0.1:8545"
ws_bind = "127.0.0.1:8546"
historical_mode = "on_demand"
transaction_locator = false
minimum_recent_blocks = 128

[api]
bind = "127.0.0.1:8080"

[api.delivery.history_batches]
target_encoded_bytes = "4MiB"
maximum_encoded_bytes = "16MiB"
maximum_events = 20000
maximum_processed_blocks = 8192
maximum_delay = "50ms"
maximum_buffered_batches = 4
maximum_buffered_bytes = "64MiB"
compression = "gzip"

[api.delivery.live_batches]
target_encoded_bytes = "64KiB"
maximum_encoded_bytes = "1MiB"
maximum_events = 1000
maximum_processed_blocks = 8
maximum_delay = "10ms"
maximum_buffered_batches = 2
maximum_buffered_bytes = "2MiB"
compression = "gzip"
