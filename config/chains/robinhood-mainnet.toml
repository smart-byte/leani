name = "robinhood-mainnet"
aliases = ["robinhood", "robinhood-chain"]
family = "arbitrum"
chain_id = 4663
genesis_hash = "0xaad15f3d702aaea00caf3e9bb56395efe9127bc3b31b24921abf1eee3409305c"

# Nitro chains run no public execution P2P: blocks come from JSON-RPC and
# are checked against their own header, transactions, and receipts roots.
[defaults]
# Two independent operators: Robinhood and dRPC. A block counts once both
# serve the same hash.
rpc_endpoints = [
  "https://rpc.mainnet.chain.robinhood.com",
  "https://robinhood.drpc.org",
]

# The BoLD rollup, as the bridge's rollup() names it.
[l1_anchor]
kind = "nitro_rollup"
rollup = "0x23A19d23e89166adedbDcB432518AB01e4272D94"
