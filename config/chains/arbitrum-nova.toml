name = "arbitrum-nova"
aliases = ["nova"]
family = "arbitrum"
chain_id = 42170
genesis_hash = "0x2ad24e03026118f9b3a48626f0636e38c93660e90a6812e853a99aa8c5371561"

# Nitro chains run no public execution P2P: blocks come from JSON-RPC and
# are checked against their own header, transactions, and receipts roots.
[defaults]
rpc_endpoints = ["https://nova.arbitrum.io/rpc"]

# The BoLD rollup, as the bridge's rollup() names it.
[l1_anchor]
kind = "nitro_rollup"
rollup = "0xE7E8cCC7c381809BDC4b213CE44016300707B7Bd"

# The signer is a batch poster of SequencerInbox
# 0x211e1c4c7f1bf5351ac850ed10fd68cffcf6c21b.
[sequencer_feed]
url = "wss://nova.arbitrum.io/feed"
signer = "0x0C5911d57B24FCF1DC8B2608eFbAe57C7098E32D"
