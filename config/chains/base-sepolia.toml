name = "base-sepolia"
family = "op-stack"
chain_id = 84532
genesis_hash = "0x0dcc9e089e30b90ddfc55be9a37dd15bc551aeee999d2e2b51414c54eaf934e4"

# Base execution peers run Discv5 under their own protocol id, with Discv4
# off, so stock discovery never meets them.
[execution]
discv4 = false
discv5_protocol_id = "basev0"
bootnodes = [
  "enode://548f715f3fc388a7c917ba644a2f16270f1ede48a5d88a4d14ea287cc916068363f3092e39936f1a3e7885198bef0e5af951f1d7b1041ce8ba4010917777e71f@18.210.176.114:30301",
  "enode://548f715f3fc388a7c917ba644a2f16270f1ede48a5d88a4d14ea287cc916068363f3092e39936f1a3e7885198bef0e5af951f1d7b1041ce8ba4010917777e71f@18.210.176.114:9200",
  "enode://6f10052847a966a725c9f4adf6716f9141155b99a0fb487fea3f51498f4c2a2cb8d534e680ee678f9447db85b93ff7c74562762c3714783a7233ac448603b25f@107.21.251.55:30301",
  "enode://6f10052847a966a725c9f4adf6716f9141155b99a0fb487fea3f51498f4c2a2cb8d534e680ee678f9447db85b93ff7c74562762c3714783a7233ac448603b25f@107.21.251.55:9200",
]

# Public keyless endpoints, paced to the limits their operators announce.
# They serve while no execution peer does, and each block they serve must
# have the hash the sequencer signed or link to one.
[defaults]
rpc_endpoints = [
  "https://sepolia.base.org",
  "https://base-sepolia-rpc.publicnode.com",
  "https://base-sepolia.drpc.org",
]

[op_stack]
# SystemConfig.unsafeBlockSigner() on Ethereum Sepolia.
sequencer_signer = "0xb830b99c95ea32300039624cb567d324d4b1d83c"
# Derivation reads batches from the batcher's transactions to the batch
# inbox; SystemConfig.batcherHash() on Ethereum Sepolia names the batcher.
batch_inbox = "0xff00000000000000000000000000000000084532"
batcher = "0xfc56e7272eebbba5bc6c544e159483c4a38f8ba3"
