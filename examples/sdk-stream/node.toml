config_version = 1
data_dir = "./data/sdk-stream"

[chain]
name = "ethereum-mainnet"
chain_id = 1

[budgets]
memory_bytes = 536870912
temporary_disk_bytes = 2147483648
pending_delta_bytes = 268435456
recent_raw_soft_bytes = 268435456
recent_raw_hard_bytes = 536870912
source_concurrency = 4
mapper_concurrency = 4

[budgets.delivery]
maximum_retained_bytes = "1536MiB"
maximum_history_retained_bytes = "1GiB"

[budgets.store]
maximum_physical_bytes = "2GiB"

[budgets.artifacts]
maximum_retained_bytes = "1GiB"
maximum_pending_bytes = "256MiB"

[[sources.history]]
id = "xatu"
kind = "xatu"
priority = 10
trust = "trusted_dataset"

[sources.live]
kind = "disabled"
minimum_peers = 0

[finality]
kind = "disabled"
checkpoint = ""

[[processors]]
id = "uniswap-latest"
instance = "usdc-weth-latest"
version = "2.0.0"
history_control = "node_owned"
history_mode = "on_demand"
start_block = 17000000
publish = "included_and_finalized"

[processors.state]
mode = "checkpointed"

[processors.artifacts]
mode = "none"

[processors.output]
mode = "latest"

[processors.delivery]
mode = "window"

[processors.checkpoint]
mode = "automatic"
keep = 3

[processors.undo]
mode = "unfinalized"
safety_blocks = 256

[[processors.settings.pools]]
address = "0x88e6A0c2dDD26FEEb64F039a2c41296FcB3f5640"  # USDC/WETH 0.05%
kind = "v3"

[rpc]
http_bind = "127.0.0.1:8545"
ws_bind = "127.0.0.1:8546"
historical_mode = "on_demand"
transaction_locator = false
minimum_recent_blocks = 128

[api]
bind = "127.0.0.1:8080"
