  /v1/processors/{processor}/query/latest:
    parameters:
      - $ref: "#/components/parameters/Processor"
    get:
      summary: Read the latest indexed Ethereum block summary
      operationId: getLatestBlockSummary
      responses:
        "200":
          description: Latest block summary produced by the selected processor instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LatestBlockSummary"
        default:
          $ref: "#/components/responses/Error"
  /v1/processors/{processor}/query/blocks/{number}:
    parameters:
      - $ref: "#/components/parameters/Processor"
      - name: number
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/SafeInteger"
    get:
      summary: Read an indexed Ethereum block summary by block number
      operationId: getBlockSummaryByNumber
      responses:
        "200":
          description: Canonical block summary at the selected height.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LatestBlockSummary"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Processor:
      name: processor
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    After:
      name: after
      in: query
      description: Opaque cursor of the last fully committed event.
      schema:
        $ref: "#/components/schemas/Cursor"
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    Collection:
      name: collection
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    Consumer:
      name: consumer
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ConsumerCredential:
      name: x-leani-consumer-credential
      in: header
      required: false
      description: |
        The consumer's credential. A consumer created with one needs it, in
        addition to any bearer token, on its lease, change, acknowledgement,
        and stream requests, and gets 403 `forbidden` without it or with
        another; the node compares it in constant time. Listing, inspecting,
        and revoking consumers need only the bearer token. A consumer without
        one, such as a configured consumer, takes none. Credentials created
        before 32 characters were required keep working.
      schema:
        type: string
        minLength: 16
        maxLength: 512
    LeaniRequest:
      name: x-leani-request
      in: header
      required: false
      description: |
        Marks a mutating request without a JSON body as sent by a Leani
        client. A POST or DELETE needs `content-type: application/json` or
        this header, and gets HTTP 415 otherwise.
      schema:
        const: "1"
    Subscription:
      name: subscription
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    Identifier:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    Block:
      name: block
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/SafeInteger"
    FromBlock:
      name: fromBlock
      in: query
      schema:
        $ref: "#/components/schemas/SafeInteger"
    ToBlock:
      name: toBlock
      in: query
      schema:
        $ref: "#/components/schemas/SafeInteger"
    FromTimestamp:
      name: fromTimestamp
      in: query
      schema:
        $ref: "#/components/schemas/SafeInteger"
    ToTimestamp:
      name: toTimestamp
      in: query
      schema:
        $ref: "#/components/schemas/SafeInteger"
  responses:
    Error:
      description: Stable machine-readable error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
  schemas:
    SafeInteger:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    DecimalQuantity:
      type: string
      pattern: "^(0|[1-9][0-9]*)$"
      examples: ["1000000000000000000"]
    SignedDecimalQuantity:
      type: string
      pattern: "^-?(0|[1-9][0-9]*)$"
      examples: ["-1000000000000000000"]
    Hash32:
      type: string
      pattern: "^0x[0-9a-f]{64}$"
    Address:
      type: string
      pattern: "^0x[0-9a-f]{40}$"
    Cursor:
      type: string
      minLength: 1
      description: Store-, chain-, and processor-bound opaque value.
    Finality:
      type: string
      enum: [preview, included, finalized]
      description: |
        Chain-confidence status of the block a record belongs to.
        `included`: the block is on the currently followed chain; a reorg can
        still remove it. `finalized`: Ethereum consensus has finalized the
        block, as verified by this node's configured finality source. When a
        source serves finalized material under dataset trust (Xatu, EraE), the
        label reflects that source's trust model, not an independent proof.
        `preview`: a peer supplied the block and its connection to the chain is
        still being checked; only the embedded CLI emits `preview`, the HTTP
        API never does. A record's `data.finality`, when present, always equals
        the envelope `finality`.
    ProcessorSummary:
      type: object
      additionalProperties: false
      required:
        [id, instance, version, codeHash, configHash, genericApi, changeSchema, queryExtensions, subscriptions, artifactRetention, deliveryOrdering]
      properties:
        id:
          type: string
        instance:
          type: string
        version:
          type: string
        codeHash:
          $ref: "#/components/schemas/Hash32"
        configHash:
          $ref: "#/components/schemas/Hash32"
        genericApi:
          type: string
          const: processor-v1
        changeSchema:
          type: string
        queryExtensions:
          type: array
          items:
            $ref: "#/components/schemas/QueryExtensionSummary"
        subscriptions:
          type: boolean
        artifactRetention:
          type: string
          enum: [none, window, full]
        deliveryOrdering:
          type: string
          enum: [canonical, block_versioned_idempotent]
    QueryExtensionSummary:
      type: object
      description: A processor-owned typed read contract and its active mounts.
      additionalProperties: false
      required: [id, basePath, aliasPath]
      properties:
        id:
          type: string
        basePath:
          type: string
          description: Canonical processor-instance-scoped route prefix.
        aliasPath:
          type: [string, "null"]
          description: Optional unambiguous convenience prefix; null when unavailable.
    QueryExtensionCapability:
      type: object
      description: Flattened query-extension discovery entry.
      additionalProperties: false
      required: [processor, id, basePath, aliasPath]
      properties:
        processor:
          type: string
        id:
          type: string
        basePath:
          type: string
        aliasPath:
          type: [string, "null"]
    Capabilities:
      type: object
      additionalProperties: false
      required: [chainId, ethereumRpc, processors, queryExtensions]
      properties:
        chainId:
          $ref: "#/components/schemas/SafeInteger"
        ethereumRpc:
          type: object
          additionalProperties: true
        processors:
          type: array
          items:
            $ref: "#/components/schemas/ProcessorSummary"
        queryExtensions:
          type: array
          items:
            $ref: "#/components/schemas/QueryExtensionCapability"
    NodeStatus:
      type: object
      additionalProperties: false
      required:
        [apiVersion, project, version, chainId, uptimeSeconds, databaseBytes, processor, processors, readiness]
      properties:
        apiVersion:
          const: "1"
        project:
          type: string
        version:
          type: string
        chainId:
          $ref: "#/components/schemas/SafeInteger"
        uptimeSeconds:
          $ref: "#/components/schemas/SafeInteger"
        databaseBytes:
          $ref: "#/components/schemas/SafeInteger"
        processor:
          $ref: "#/components/schemas/ProcessorSummary"
        processors:
          type: array
          items:
            $ref: "#/components/schemas/ProcessorSummary"
        readiness:
          $ref: "#/components/schemas/Readiness"
    Readiness:
      type: object
      additionalProperties: false
      required: [liveRequired, liveReady, finalityRequired, finalityReady, ready]
      properties:
        liveRequired:
          type: boolean
        liveReady:
          type: boolean
        finalityRequired:
          type: boolean
        finalityReady:
          type: boolean
        ready:
          type: boolean
    Health:
      type: object
      additionalProperties: false
      required: [status, uptimeSeconds, database, readiness, reasons]
      properties:
        status:
          type: string
          enum: [live, ready, not_ready, failed]
        uptimeSeconds:
          $ref: "#/components/schemas/SafeInteger"
        database:
          type: string
          enum: [available, unavailable]
        readiness:
          $ref: "#/components/schemas/Readiness"
        reasons:
          type: array
          items:
            type: string
    CoverageInterval:
      type: object
      description: >-
        Inclusive covered range whose finality is uniform for every block in
        the interval. Ranges are split at coverage gaps and exact finality
        boundaries.
      additionalProperties: false
      required: [fromBlock, toBlock, finality]
      properties:
        fromBlock:
          $ref: "#/components/schemas/SafeInteger"
        toBlock:
          $ref: "#/components/schemas/SafeInteger"
        finality:
          $ref: "#/components/schemas/Finality"
    RequestedRange:
      type: object
      additionalProperties: false
      required: [fromBlock, toBlock]
      properties:
        fromBlock:
          $ref: "#/components/schemas/SafeInteger"
        toBlock:
          $ref: "#/components/schemas/SafeInteger"
    ProcessorCoverage:
      type: object
      additionalProperties: false
      required:
        [chainId, chainFinalizedHead, available, configuredStartBlock, processedThrough, finalizedThrough, complete, state]
      properties:
        chainId:
          $ref: "#/components/schemas/SafeInteger"
        chainFinalizedHead:
          oneOf:
            - $ref: "#/components/schemas/ChainFinalizedHead"
            - type: "null"
        requested:
          oneOf:
            - $ref: "#/components/schemas/RequestedRange"
            - type: "null"
        available:
          type: array
          description: >-
            Exact processor coverage split at gaps and finality boundaries.
            Use these intervals when selecting finalized coverage.
          items:
            $ref: "#/components/schemas/CoverageInterval"
        configuredStartBlock:
          $ref: "#/components/schemas/SafeInteger"
        processedThrough:
          oneOf:
            - $ref: "#/components/schemas/SafeInteger"
            - type: "null"
        finalizedThrough:
          description: >-
            Highest covered block recorded as finalized. This is not a
            contiguous-coverage guarantee; lower gaps or non-finalized blocks
            can exist. Inspect available intervals for exact finalized
            coverage.
          oneOf:
            - $ref: "#/components/schemas/SafeInteger"
            - type: "null"
        complete:
          type: boolean
        state:
          description: |
            `paused` and `failed` report the processor's live lane;
            `/v1/network/status` gives its `pauseReason`. `catching_up`
            means the range has no gaps but the processor has not reached
            `chainFinalizedHead` or the node is not ready; only then is it
            `live`.
          type: string
          enum: [starting, backfilling, catching_up, live, degraded, paused, failed]
    ChainFinalizedHead:
      type: object
      additionalProperties: false
      required: [number, hash]
      properties:
        number:
          $ref: "#/components/schemas/SafeInteger"
        hash:
          $ref: "#/components/schemas/Hash32"
    OutputCollections:
      type: object
      additionalProperties: false
      required: [processor, outputMode, retained, data]
      properties:
        processor:
          $ref: "#/components/schemas/ProcessorSummary"
        outputMode:
          type: string
          enum: [none, latest, window, full]
        retained:
          type: boolean
        data:
          type: array
          items:
            type: string
    OutputQuery:
      type: object
      additionalProperties: false
      properties:
        fromBlock:
          $ref: "#/components/schemas/SafeInteger"
        toBlock:
          $ref: "#/components/schemas/SafeInteger"
        fromTimestamp:
          $ref: "#/components/schemas/SafeInteger"
        toTimestamp:
          $ref: "#/components/schemas/SafeInteger"
        limit:
          type: integer
          minimum: 1
          maximum: 1000
    OutputBounds:
      type: object
      additionalProperties: false
      required:
        [earliestBlock, latestBlock, earliestTimestamp, latestTimestamp]
      properties:
        earliestBlock:
          $ref: "#/components/schemas/SafeInteger"
        latestBlock:
          $ref: "#/components/schemas/SafeInteger"
        earliestTimestamp:
          $ref: "#/components/schemas/SafeInteger"
        latestTimestamp:
          $ref: "#/components/schemas/SafeInteger"
    GenericOutputEntity:
      type: object
      additionalProperties: false
      required:
        [ordinal, key, schema, data, blockNumber, blockTimestamp, finality]
      properties:
        ordinal:
          $ref: "#/components/schemas/DecimalQuantity"
        key:
          type: string
          pattern: "^0x[0-9a-f]*$"
        schema:
          type: string
        data: {}
        blockNumber:
          $ref: "#/components/schemas/SafeInteger"
        blockTimestamp:
          $ref: "#/components/schemas/SafeInteger"
        finality:
          $ref: "#/components/schemas/Finality"
    GenericOutputPage:
      type: object
      additionalProperties: false
      required: [data, nextCursor, retainedBounds, coverage]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/GenericOutputEntity"
        nextCursor:
          oneOf:
            - $ref: "#/components/schemas/Cursor"
            - type: "null"
        retainedBounds:
          oneOf:
            - $ref: "#/components/schemas/OutputBounds"
            - type: "null"
        coverage:
          $ref: "#/components/schemas/ProcessorCoverage"
    GenericSnapshotPage:
      type: object
      additionalProperties: false
      required:
        [data, nextCursor, snapshotId, boundaryCursor, rowCount, valueBytes, expiresAtUnixMs, retainedBounds, coverage, recovery]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/GenericOutputEntity"
        nextCursor:
          oneOf:
            - $ref: "#/components/schemas/Cursor"
            - type: "null"
        snapshotId:
          type: string
          pattern: "^[0-9a-f]{32}$"
        boundaryCursor:
          description: |
            Null when the processor has delivery disabled or is
            `finalized_only`, whose retained state holds unpublished blocks.
          oneOf:
            - $ref: "#/components/schemas/Cursor"
            - type: "null"
        rowCount:
          $ref: "#/components/schemas/DecimalQuantity"
        valueBytes:
          description: Snapshot accounting bytes, including entity keys and row overhead.
          $ref: "#/components/schemas/DecimalQuantity"
        expiresAtUnixMs:
          $ref: "#/components/schemas/DecimalQuantity"
        retainedBounds:
          oneOf:
            - $ref: "#/components/schemas/OutputBounds"
            - type: "null"
        coverage:
          $ref: "#/components/schemas/ProcessorCoverage"
        recovery:
          type: object
          additionalProperties: false
          required: [follow, outsideRetention]
          properties:
            follow:
              type: [string, "null"]
            outsideRetention:
              const: create_processor_instance_or_source_scan
    FollowSnapshotPage:
      allOf:
        - $ref: "#/components/schemas/GenericSnapshotPage"
        - type: object
          required: [boundaryCursor, recovery]
          properties:
            boundaryCursor:
              $ref: "#/components/schemas/Cursor"
            recovery:
              type: object
              required: [follow]
              properties:
                follow:
                  type: string
    CreateConsumer:
      type: object
      additionalProperties: false
      required: [id, role, start, leaseTtlSeconds, credential]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        role:
          type: string
          enum: [required, best_effort]
        start:
          oneOf:
            - type: object
              additionalProperties: false
              required: [position]
              properties:
                position:
                  const: earliest_retained
            - type: object
              additionalProperties: false
              required: [position]
              properties:
                position:
                  const: current_head
            - type: object
              additionalProperties: false
              required: [position, cursor]
              properties:
                position:
                  const: cursor
                cursor:
                  $ref: "#/components/schemas/Cursor"
        leaseTtlSeconds:
          type: integer
          minimum: 1
          maximum: 3153600000
        credential:
          description: |
            A random secret of 32 to 512 printable ASCII characters without
            spaces, such as `openssl rand -hex 32`. Only a hash keyed with the
            node's secret is stored. The consumer's lease, change,
            acknowledgement, and stream requests then need it; listing,
            inspecting, and revoking consumers need only the bearer token.
            These bounds apply to a new consumer: the node checks the ID
            first, so an existing consumer ID gets 409 `consumer_exists`
            whatever the credential, even one outside them.
          type: string
          minLength: 32
          maxLength: 512
          pattern: "^[!-~]+$"
          writeOnly: true
    DurableConsumer:
      type: object
      additionalProperties: false
      required:
        [id, processorInstance, streamId, role, state, acknowledgedSequence, deliveredSequence, acknowledgedCursor, deliveredCursor, leaseGeneration, leaseTtlMs, leaseExpiresAtUnixMs, leaseActive, lagChanges, lagBlocks, lagBytes, lagAgeMs, createdAtUnixMs, updatedAtUnixMs]
      properties:
        id:
          type: string
        processorInstance:
          type: string
        streamId:
          description: |
            The delivery stream this consumer reads: the processor's live or
            canonical stream, or a backfill subscription's history stream.
          type: string
        role:
          type: string
          enum: [required, best_effort]
        state:
          type: string
          enum: [active, reset_required, revoked]
        acknowledgedSequence:
          $ref: "#/components/schemas/DecimalQuantity"
        deliveredSequence:
          description: |
            The last sequence a page read or stream batch handed to this
            consumer; acknowledgement cannot pass it.
          $ref: "#/components/schemas/DecimalQuantity"
        acknowledgedCursor:
          $ref: "#/components/schemas/Cursor"
        deliveredCursor:
          $ref: "#/components/schemas/Cursor"
        leaseGeneration:
          description: |
            How many stream sessions have taken this consumer's lease; each
            new session fences the one before it. `0` before the first.
          $ref: "#/components/schemas/DecimalQuantity"
        leaseTtlMs:
          $ref: "#/components/schemas/DecimalQuantity"
        leaseExpiresAtUnixMs:
          $ref: "#/components/schemas/DecimalQuantity"
        leaseActive:
          type: boolean
        lagChanges:
          $ref: "#/components/schemas/DecimalQuantity"
        lagBlocks:
          $ref: "#/components/schemas/DecimalQuantity"
        lagBytes:
          $ref: "#/components/schemas/DecimalQuantity"
        lagAgeMs:
          $ref: "#/components/schemas/DecimalQuantity"
        createdAtUnixMs:
          $ref: "#/components/schemas/DecimalQuantity"
        updatedAtUnixMs:
          $ref: "#/components/schemas/DecimalQuantity"
    BackfillStatus:
      type: object
      description: A backfill subscription or materialization job.
      additionalProperties: false
      required:
        [id, owner, processor, processorConfigured, consumer, fromBlock, toBlock, ranges, requestedBlocks, processedBlocks, remainingBlocks, mode, state, attempts, updatedAtUnixMs, report, lastError]
      properties:
        id:
          type: string
          description: |
            Opaque; do not parse it. An application finds its own
            subscriptions by `consumer`.
        owner:
          type: string
          enum: [subscription, materialization]
        processor:
          type: string
          description: The processor instance that runs the job.
        processorConfigured:
          type: boolean
          description: |
            Whether the node configures the processor instance `processor`
            now: exactly that instance, not another instance of its kind.
            Without it, the subscription's stream and acknowledgement routes
            refuse the subscription. That can be temporary, as when a
            restart's configuration leaves the instance out by mistake. If
            the instance will not return, cancel the subscription and delete
            it with `discardUnacknowledged=true`, which discards its
            unacknowledged records.
        consumer:
          type: [string, "null"]
          description: |
            The subscription's required consumer, which reads and
            acknowledges its history stream; null for a materialization job.
        deliveryStreamId:
          type: string
          description: The subscription's history stream.
        publicationRevision:
          $ref: "#/components/schemas/DecimalQuantity"
        fromBlock:
          $ref: "#/components/schemas/SafeInteger"
        toBlock:
          $ref: "#/components/schemas/SafeInteger"
        ranges:
          type: array
          items:
            $ref: "#/components/schemas/RequestedRange"
        requestedBlocks:
          $ref: "#/components/schemas/SafeInteger"
        processedBlocks:
          $ref: "#/components/schemas/SafeInteger"
        remainingBlocks:
          $ref: "#/components/schemas/SafeInteger"
        capturedFinalizedTarget:
          $ref: "#/components/schemas/SafeInteger"
        mode:
          type: string
          enum: [fill_missing, recompute]
        batching:
          type: object
          description: The subscription's effective history batch limits.
          additionalProperties: false
          required:
            [targetEncodedBytes, maximumEncodedBytes, maximumEvents, maximumProcessedBlocks, maximumDelayMs, maximumBufferedBatches, maximumBufferedBytes, compression]
          properties:
            targetEncodedBytes:
              $ref: "#/components/schemas/SafeInteger"
            maximumEncodedBytes:
              $ref: "#/components/schemas/SafeInteger"
            maximumEvents:
              $ref: "#/components/schemas/SafeInteger"
            maximumProcessedBlocks:
              $ref: "#/components/schemas/SafeInteger"
            maximumDelayMs:
              $ref: "#/components/schemas/SafeInteger"
            maximumBufferedBatches:
              $ref: "#/components/schemas/SafeInteger"
            maximumBufferedBytes:
              $ref: "#/components/schemas/SafeInteger"
            compression:
              type: string
              enum: [none, gzip]
        state:
          type: string
          enum: [waiting_for_consumer, queued, running, backpressured, storage_backpressured, draining, complete_reclaimable, completed, failed, cancelled]
        attempts:
          $ref: "#/components/schemas/SafeInteger"
        updatedAtUnixMs:
          $ref: "#/components/schemas/SafeInteger"
        report:
          description: The completed job's source report; null until it completes.
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        lastError:
          type: [string, "null"]
    RecoveryCheckpoint:
      type: object
      additionalProperties: false
      required:
        [checkpointId, processorInstance, blockNumber, blockHash, stateChecksum, stateBytes, createdAtUnixMs]
      properties:
        checkpointId:
          $ref: "#/components/schemas/SafeInteger"
        processorInstance:
          type: string
        blockNumber:
          $ref: "#/components/schemas/SafeInteger"
        blockHash:
          $ref: "#/components/schemas/Hash32"
        stateChecksum:
          $ref: "#/components/schemas/Hash32"
        stateBytes:
          $ref: "#/components/schemas/SafeInteger"
        createdAtUnixMs:
          $ref: "#/components/schemas/SafeInteger"
    RecoveryRestore:
      type: object
      additionalProperties: false
      required:
        [checkpointId, processor, blockNumber, blockHash, finality, sequence]
      properties:
        checkpointId:
          $ref: "#/components/schemas/DecimalQuantity"
        processor:
          $ref: "#/components/schemas/ProcessorSummary"
        blockNumber:
          $ref: "#/components/schemas/SafeInteger"
        blockHash:
          $ref: "#/components/schemas/Hash32"
        finality:
          $ref: "#/components/schemas/Finality"
        sequence:
          $ref: "#/components/schemas/DecimalQuantity"
    PortableSavepoint:
      type: object
      additionalProperties: false
      required:
        [savepointId, processorInstance, blockNumber, blockHash, stateChecksum, stateBytes, createdAtUnixMs]
      properties:
        savepointId:
          type: string
        processorInstance:
          type: string
        blockNumber:
          $ref: "#/components/schemas/SafeInteger"
        blockHash:
          $ref: "#/components/schemas/Hash32"
        stateChecksum:
          $ref: "#/components/schemas/Hash32"
        stateBytes:
          $ref: "#/components/schemas/SafeInteger"
        createdAtUnixMs:
          $ref: "#/components/schemas/SafeInteger"
    BlobBlock:
      type: object
      additionalProperties: false
      required:
        - network
        - blockNumber
        - blockHash
        - parentHash
        - timestamp
        - size
        - blobCount
        - blobGasUsed
        - excessBlobGas
        - blobBaseFee
        - executionBaseFee
        - gasUsed
        - gasLimit
        - executionEthBurnedWei
        - blobEthBurnedWei
        - reserveFeeWei
        - transactionCount
        - targetBlobsPerBlock
        - maxBlobsPerBlock
        - transformVersion
        - finality
      properties:
        network:
          type: string
        blockNumber:
          $ref: "#/components/schemas/SafeInteger"
        blockHash:
          $ref: "#/components/schemas/Hash32"
        parentHash:
          $ref: "#/components/schemas/Hash32"
        timestamp:
          $ref: "#/components/schemas/SafeInteger"
        size:
          $ref: "#/components/schemas/DecimalQuantity"
        blobCount:
          $ref: "#/components/schemas/SafeInteger"
        blobGasUsed:
          $ref: "#/components/schemas/DecimalQuantity"
        excessBlobGas:
          $ref: "#/components/schemas/DecimalQuantity"
        blobBaseFee:
          description: >-
            Protocol blob base fee in wei per blob gas: the EIP-4844 fee for
            excessBlobGas under the fork active at the block's timestamp.
            EIP-7918 does not change it.
          $ref: "#/components/schemas/DecimalQuantity"
        executionBaseFee:
          $ref: "#/components/schemas/DecimalQuantity"
        gasUsed:
          $ref: "#/components/schemas/DecimalQuantity"
        gasLimit:
          $ref: "#/components/schemas/DecimalQuantity"
        executionEthBurnedWei:
          $ref: "#/components/schemas/DecimalQuantity"
        blobEthBurnedWei:
          description: blobBaseFee times blobGasUsed.
          $ref: "#/components/schemas/DecimalQuantity"
        reserveFeeWei:
          description: >-
            EIP-7918 reserve price in wei per blob gas from Fusaka on, null
            before. It only changes how excess blob gas evolves and is not
            applied to blobBaseFee.
          oneOf:
            - $ref: "#/components/schemas/DecimalQuantity"
            - type: "null"
        transactionCount:
          $ref: "#/components/schemas/SafeInteger"
        targetBlobsPerBlock:
          $ref: "#/components/schemas/SafeInteger"
        maxBlobsPerBlock:
          $ref: "#/components/schemas/SafeInteger"
        transformVersion:
          $ref: "#/components/schemas/SafeInteger"
        finality:
          $ref: "#/components/schemas/Finality"
    BlobTransaction:
      type: object
      additionalProperties: false
      required:
        [network, blockNumber, blockHash, txHash, transactionIndex, senderAddress, blobVersionedHashes, blobCount, totalBurnedWei, executionBurnedWei, blobBurnedWei]
      properties:
        network:
          type: string
        blockNumber:
          $ref: "#/components/schemas/SafeInteger"
        blockHash:
          $ref: "#/components/schemas/Hash32"
        txHash:
          $ref: "#/components/schemas/Hash32"
        transactionIndex:
          $ref: "#/components/schemas/SafeInteger"
        senderAddress:
          $ref: "#/components/schemas/Address"
        blobVersionedHashes:
          type: array
          items:
            $ref: "#/components/schemas/Hash32"
        blobCount:
          $ref: "#/components/schemas/SafeInteger"
        totalBurnedWei:
          $ref: "#/components/schemas/DecimalQuantity"
        executionBurnedWei:
          $ref: "#/components/schemas/DecimalQuantity"
        blobBurnedWei:
          description: The block's blobBaseFee times this transaction's blob gas.
          $ref: "#/components/schemas/DecimalQuantity"
    BlobSchedule:
      type: object
      additionalProperties: false
      required:
        [name, activationBlock, activationTimestamp, forkId, targetBlobsPerBlock, maxBlobsPerBlock, baseFeeUpdateFraction, eip7918, source]
      properties:
        name:
          type: string
        activationBlock:
          description: >-
            Block-number label for atBlock lookups. For Dencun it is 19426589,
            the first block the blobs processor covers.
          $ref: "#/components/schemas/SafeInteger"
        activationTimestamp:
          description: The fork's parameters apply to blocks from this timestamp on.
          $ref: "#/components/schemas/SafeInteger"
        forkId:
          type: string
          pattern: "^0x[0-9a-f]{8}$"
        targetBlobsPerBlock:
          $ref: "#/components/schemas/SafeInteger"
        maxBlobsPerBlock:
          $ref: "#/components/schemas/SafeInteger"
        baseFeeUpdateFraction:
          $ref: "#/components/schemas/DecimalQuantity"
        eip7918:
          type: boolean
        source:
          type: string
          enum: [chain_spec, eth_config, configured]
    Erc20Balance:
      type: object
      additionalProperties: false
      required: [token, address, balance, asOfBlock, blockHash, finality, coverageFrom, complete, incompleteFrom, method]
      properties:
        token:
          $ref: "#/components/schemas/Address"
        address:
          $ref: "#/components/schemas/Address"
        balance:
          $ref: "#/components/schemas/DecimalQuantity"
        asOfBlock:
          $ref: "#/components/schemas/SafeInteger"
        blockHash:
          $ref: "#/components/schemas/Hash32"
        finality:
          $ref: "#/components/schemas/Finality"
        coverageFrom:
          $ref: "#/components/schemas/SafeInteger"
        complete:
          type: boolean
        incompleteFrom:
          description: >-
            Block whose transfer the ledger could not apply for this token and
            holder, an outgoing transfer above the derived balance or an
            incoming one that overflows it. From that block the pair is
            incomplete and no longer derived, and balance keeps its last
            derived value. Null while the pair is derived.
          oneOf:
            - $ref: "#/components/schemas/SafeInteger"
            - type: "null"
        method:
          type: string
          const: erc20_transfer_ledger
    UniswapPoolPrice:
      type: object
      additionalProperties: false
      required: [pool, kind, reserve0, reserve1, amount0, amount1, sqrtPriceX96, blockNumber, blockHash, logIndex, finality]
      properties:
        pool:
          $ref: "#/components/schemas/Address"
        kind:
          type: string
          enum: [v2, v3]
        reserve0:
          oneOf:
            - $ref: "#/components/schemas/DecimalQuantity"
            - type: "null"
        reserve1:
          oneOf:
            - $ref: "#/components/schemas/DecimalQuantity"
            - type: "null"
        amount0:
          oneOf:
            - $ref: "#/components/schemas/SignedDecimalQuantity"
            - type: "null"
        amount1:
          oneOf:
            - $ref: "#/components/schemas/SignedDecimalQuantity"
            - type: "null"
        sqrtPriceX96:
          oneOf:
            - $ref: "#/components/schemas/DecimalQuantity"
            - type: "null"
        blockNumber:
          $ref: "#/components/schemas/SafeInteger"
        blockHash:
          $ref: "#/components/schemas/Hash32"
        logIndex:
          $ref: "#/components/schemas/SafeInteger"
        finality:
          $ref: "#/components/schemas/Finality"
    ConfiguredUniswapPool:
      type: object
      additionalProperties: false
      required: [address, kind]
      properties:
        address:
          $ref: "#/components/schemas/Address"
        kind:
          type: string
          enum: [v2, v3]
    ConfiguredUniswapPools:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ConfiguredUniswapPool"
    LatestUniswapObservation:
      type: object
      additionalProperties: false
      required: [data, timestamp]
      properties:
        data:
          $ref: "#/components/schemas/UniswapPoolPrice"
        timestamp:
          $ref: "#/components/schemas/SafeInteger"
    BlockSummary:
      type: object
      additionalProperties: false
      required: [chainId, blockNumber, blockHash, parentHash, timestamp, gasLimit, gasUsed, baseFeePerGas, blobGasUsed, excessBlobGas, transactionCount, sizeBytes, finality]
      properties:
        chainId:
          $ref: "#/components/schemas/SafeInteger"
        blockNumber:
          $ref: "#/components/schemas/SafeInteger"
        blockHash:
          $ref: "#/components/schemas/Hash32"
        parentHash:
          $ref: "#/components/schemas/Hash32"
        timestamp:
          $ref: "#/components/schemas/SafeInteger"
        gasLimit:
          oneOf:
            - $ref: "#/components/schemas/SafeInteger"
            - type: "null"
        gasUsed:
          oneOf:
            - $ref: "#/components/schemas/SafeInteger"
            - type: "null"
        baseFeePerGas:
          oneOf:
            - $ref: "#/components/schemas/DecimalQuantity"
            - type: "null"
        blobGasUsed:
          oneOf:
            - $ref: "#/components/schemas/SafeInteger"
            - type: "null"
        excessBlobGas:
          oneOf:
            - $ref: "#/components/schemas/SafeInteger"
            - type: "null"
        transactionCount:
          oneOf:
            - $ref: "#/components/schemas/SafeInteger"
            - type: "null"
        sizeBytes:
          oneOf:
            - $ref: "#/components/schemas/SafeInteger"
            - type: "null"
        finality:
          $ref: "#/components/schemas/Finality"
    LatestBlockSummary:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/BlockSummary"
    ChangeBlock:
      type: object
      additionalProperties: false
      required: [number, hash, parentHash, timestamp]
      properties:
        number:
          $ref: "#/components/schemas/SafeInteger"
        hash:
          $ref: "#/components/schemas/Hash32"
        parentHash:
          $ref: "#/components/schemas/Hash32"
        timestamp:
          $ref: "#/components/schemas/SafeInteger"
    ChangeEnvelope:
      type: object
      additionalProperties: false
      required:
        [apiVersion, sequence, cursor, operation, originKind, originId, publicationRevision, chainId, block, finality, kind, schema, key, data, emittedAt]
      properties:
        apiVersion:
          const: "1"
        sequence:
          $ref: "#/components/schemas/DecimalQuantity"
        cursor:
          $ref: "#/components/schemas/Cursor"
        operation:
          type: string
          enum: [apply, undo, finalized, reset_required]
        originKind:
          type: string
          enum: [live, live_recovery, historical_backfill, recompute]
          description: Processing lane that produced this publication.
        originId:
          type: string
          description: Durable identity of the live lane, recovery, subscription, or recompute job.
        publicationRevision:
          $ref: "#/components/schemas/DecimalQuantity"
        chainId:
          $ref: "#/components/schemas/SafeInteger"
        block:
          oneOf:
            - $ref: "#/components/schemas/ChangeBlock"
            - type: "null"
        finality:
          $ref: "#/components/schemas/Finality"
        kind:
          type: string
        schema:
          type: string
          description: Versioned processor change schema identifier.
        key:
          oneOf:
            - type: string
              pattern: "^0x[0-9a-f]*$"
            - type: "null"
        data:
          description: |
            The processor's entity for `apply` and `undo`. For `finalized`,
            the `system.finality.put` kind carries `{ throughBlock }`, and the
            `system.live_gap.put` kind carries
            `{ fromBlock, toBlock, reason: "not_filled" }`: blocks the live
            lane skipped, such as after a restart at a later finalized anchor.
            Leani does not fill them; request them as history.
        coverage:
          $ref: "#/components/schemas/ProcessorCoverage"
          description: Present only on reset_required events.
        emittedAt:
          type: string
          description: Stable emission timestamp.
    LiveStreamRecord:
      oneOf:
        - $ref: "#/components/schemas/LiveStreamHello"
        - $ref: "#/components/schemas/LiveStreamBatch"
        - $ref: "#/components/schemas/StreamHeartbeat"
        - $ref: "#/components/schemas/StreamFailure"
    LiveStreamHello:
      type: object
      additionalProperties: false
      required:
        [type, apiVersion, chainId, processor, streamId, streamKind, acknowledgedCursor, storeEpoch, heartbeatIntervalMs, sessionToken, sessionExpiresAtUnixMs, leaseTtlMs, coverage]
      properties:
        type:
          const: hello
        apiVersion:
          const: "1"
        chainId:
          $ref: "#/components/schemas/SafeInteger"
        processor:
          $ref: "#/components/schemas/ProcessorSummary"
        streamId:
          type: string
        streamKind:
          const: live
        acknowledgedCursor:
          $ref: "#/components/schemas/Cursor"
        storeEpoch:
          type: string
        heartbeatIntervalMs:
          $ref: "#/components/schemas/DecimalQuantity"
        sessionToken:
          type: string
          description: Send as `x-leani-consumer-session` to acknowledge, renew, or release.
        sessionExpiresAtUnixMs:
          $ref: "#/components/schemas/DecimalQuantity"
        leaseTtlMs:
          $ref: "#/components/schemas/DecimalQuantity"
        coverage:
          $ref: "#/components/schemas/ProcessorCoverage"
          description: What the processor covers as the session starts, to diff against the destination.
    LiveStreamBatch:
      type: object
      additionalProperties: false
      required:
        [type, streamId, originKind, originId, publicationRevision, fromBlock, throughBlock, processedBlockCount, domainChangeCount, progressUnitCount, rawPayloadBytes, uncompressedEncodedBytes, transmittedBytes, buildDelayMs, firstCursor, lastCursor, acknowledgeableCursor, changes]
      properties:
        type:
          const: batch
        streamId:
          type: string
        originKind:
          type: string
          enum: [live, live_recovery]
        originId:
          type: string
        publicationRevision:
          $ref: "#/components/schemas/DecimalQuantity"
        fromBlock:
          $ref: "#/components/schemas/SafeInteger"
        throughBlock:
          $ref: "#/components/schemas/SafeInteger"
        processedBlockCount:
          $ref: "#/components/schemas/DecimalQuantity"
        domainChangeCount:
          $ref: "#/components/schemas/DecimalQuantity"
          description: Changes other than `system.*` kinds.
        progressUnitCount:
          $ref: "#/components/schemas/DecimalQuantity"
        rawPayloadBytes:
          $ref: "#/components/schemas/DecimalQuantity"
        uncompressedEncodedBytes:
          $ref: "#/components/schemas/DecimalQuantity"
        transmittedBytes:
          $ref: "#/components/schemas/DecimalQuantity"
        buildDelayMs:
          $ref: "#/components/schemas/DecimalQuantity"
        firstCursor:
          $ref: "#/components/schemas/Cursor"
        lastCursor:
          $ref: "#/components/schemas/Cursor"
        acknowledgeableCursor:
          $ref: "#/components/schemas/Cursor"
        changes:
          type: array
          items:
            $ref: "#/components/schemas/ChangeEnvelope"
    StreamHeartbeat:
      type: object
      additionalProperties: false
      required: [type, emittedAt]
      properties:
        type:
          const: heartbeat
        emittedAt:
          type: string
    StreamFailure:
      type: object
      additionalProperties: false
      required: [type, code, message, earliestAvailableSequence, latestAvailableSequence]
      properties:
        type:
          type: string
          enum: [error, reset_required]
        code:
          type: string
        message:
          type: string
        earliestAvailableSequence:
          oneOf:
            - $ref: "#/components/schemas/DecimalQuantity"
            - type: "null"
        latestAvailableSequence:
          oneOf:
            - $ref: "#/components/schemas/DecimalQuantity"
            - type: "null"
    ChangeHead:
      type: object
      additionalProperties: false
      required: [earliestSequence, latestSequence, cursor]
      properties:
        earliestSequence:
          oneOf:
            - $ref: "#/components/schemas/DecimalQuantity"
            - type: "null"
        latestSequence:
          oneOf:
            - $ref: "#/components/schemas/DecimalQuantity"
            - type: "null"
        cursor:
          oneOf:
            - $ref: "#/components/schemas/Cursor"
            - type: "null"
    BlobSnapshotEntry:
      type: object
      additionalProperties: false
      required: [block, transactions]
      properties:
        block:
          $ref: "#/components/schemas/BlobBlock"
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/BlobTransaction"
    BlobBlockPage:
      type: object
      additionalProperties: false
      required: [data, nextCursor, coverage]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/BlobBlock"
        nextCursor:
          oneOf:
            - $ref: "#/components/schemas/Cursor"
            - type: "null"
        coverage:
          $ref: "#/components/schemas/ProcessorCoverage"
    BlobTransactionPage:
      type: object
      additionalProperties: false
      required: [data, nextCursor, coverage]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/BlobTransaction"
        nextCursor:
          oneOf:
            - $ref: "#/components/schemas/Cursor"
            - type: "null"
        coverage:
          $ref: "#/components/schemas/ProcessorCoverage"
    BlobSnapshotPage:
      type: object
      additionalProperties: false
      required: [data, nextCursor, coverage]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/BlobSnapshotEntry"
        nextCursor:
          oneOf:
            - $ref: "#/components/schemas/Cursor"
            - type: "null"
        coverage:
          $ref: "#/components/schemas/ProcessorCoverage"
    ChangePage:
      type: object
      additionalProperties: false
      required: [data, nextCursor, coverage]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ChangeEnvelope"
        nextCursor:
          oneOf:
            - $ref: "#/components/schemas/Cursor"
            - type: "null"
        coverage:
          $ref: "#/components/schemas/ProcessorCoverage"
    ErrorBody:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, retryable, requestId]
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
            details:
              oneOf:
                - type: object
                  additionalProperties: true
                - type: "null"
            requestId:
              type: string
