openapi: 3.1.0
info:
  title: leani native API
  version: 1.0.0
  description: |
    Coverage-aware queries and durable processor changes. All cursors are
    opaque. Ethereum quantities that can exceed JavaScript's safe integer
    range are encoded as unsigned decimal strings.

    Every route answers a `Host` name other than `localhost` and those in
    `api.allowed_hosts` with 421 `host_not_allowed` (IP addresses pass), and
    a browser `Origin` other than a loopback one or one in
    `api.allowed_origins` with 403 `origin_not_allowed`. A GET or HEAD
    without an `Origin` whose `Sec-Fetch-Site` is `cross-site` or
    `same-site` and whose `Sec-Fetch-Mode` is not `navigate` gets 403
    `cross_site_request`; on the two consumer stream routes, so does one in
    any mode, navigations included. A POST or DELETE needs
    `content-type: application/json` or `x-leani-request: 1`, and gets 415
    `unsupported_media_type` otherwise.

    A consumer created with a credential needs it in
    `x-leani-consumer-credential` on every consumer-scoped delivery route,
    in addition to any bearer token, and gets 403 `forbidden` without it.
    Listing, reading, and revoking consumers are administrative: only the
    bearer token protects them, whether or not a consumer has a credential.
servers:
  - url: http://127.0.0.1:8080
security:
  - {}
  - bearerAuth: []
paths:
  /health/live:
    get:
      summary: Check process liveness
      operationId: getLiveness
      security: []
      responses:
        "200":
          description: Process and durable store are responsive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Durable store cannot be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health/ready:
    get:
      summary: Check node readiness
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: All configured serving dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: One or more required serving dependencies are unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /metrics:
    get:
      summary: Read Prometheus metrics
      operationId: getPrometheusMetrics
      security: []
      responses:
        "200":
          description: Bounded-cardinality Prometheus text exposition.
          content:
            text/plain:
              schema:
                type: string
  /v1/status:
    get:
      summary: Read node and processor status
      operationId: getStatus
      responses:
        "200":
          description: Node and store status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeStatus"
        default:
          $ref: "#/components/responses/Error"
  /v1/capabilities:
    get:
      summary: Discover node capabilities
      operationId: getCapabilities
      responses:
        "200":
          description: Exact enabled and disabled capabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        default:
          $ref: "#/components/responses/Error"
  /v1/processors:
    get:
      summary: List configured processors
      operationId: listProcessors
      responses:
        "200":
          description: Configured processors.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProcessorSummary"
  /v1/processors/{processor}/status:
    parameters:
      - $ref: "#/components/parameters/Processor"
    get:
      summary: Read processor status
      operationId: getProcessorStatus
      responses:
        "200":
          description: Processor coverage and readiness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessorCoverage"
        default:
          $ref: "#/components/responses/Error"
  /v1/processors/{processor}/schema:
    parameters:
      - $ref: "#/components/parameters/Processor"
    get:
      summary: Read a processor schema
      operationId: getProcessorSchema
      responses:
        "200":
          description: Durable processor schema identity.
          content:
            application/json:
              schema:
                type: object
                required: [processor, deltaVersion, entitySchema, changeSchema]
                properties:
                  processor:
                    $ref: "#/components/schemas/ProcessorSummary"
                  deltaVersion:
                    $ref: "#/components/schemas/SafeInteger"
                  entitySchema:
                    type: string
                  changeSchema:
                    type: string
        default:
          $ref: "#/components/responses/Error"
  /v1/processors/{processor}/changes:
    parameters:
      - $ref: "#/components/parameters/Processor"
      - $ref: "#/components/parameters/After"
      - $ref: "#/components/parameters/Limit"
    get:
      summary: List processor changes
      operationId: listProcessorChanges
      responses:
        "200":
          description: Durable changes after the supplied cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePage"
        default:
          $ref: "#/components/responses/Error"
  /v1/processors/{processor}/changes/head:
    parameters:
      - $ref: "#/components/parameters/Processor"
    get:
      summary: Read the processor change head
      operationId: getProcessorChangeHead
      responses:
        "200":
          description: |
            Current durable change-log bounds and an opaque cursor anchored at
            the latest committed change. Consumers can snapshot state and then
            resume after this cursor without a race.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeHead"
        default:
          $ref: "#/components/responses/Error"
  /v1/processors/{processor}/stream:
    parameters:
      - $ref: "#/components/parameters/Processor"
      - $ref: "#/components/parameters/After"
    get:
      summary: Stream processor changes
      operationId: streamProcessorChanges
      parameters:
        - name: Last-Event-ID
          in: header
          description: |
            The id of the last event received, which is its cursor, as an
            EventSource sends it when it reconnects. The stream resumes after
            it when `after` is absent.
          schema:
            $ref: "#/components/schemas/Cursor"
      responses:
        "200":
          description: |
            Resumable SSE stream. The event id is the opaque resume cursor and
            each data field contains one ChangeEnvelope. When the node shuts
            down, the stream ends after a whole event; reconnect after the
            last event's id. An `error` event carries an ErrorBody and ends
            the stream; reconnect only when its `retryable` is true. A stored
            change the node cannot render is not retryable.
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /v1/processors/{processor}/collections:
    parameters:
      - $ref: "#/components/parameters/Processor"
    get:
      summary: List processor collections
      operationId: listProcessorCollections
      responses:
        "200":
          description: Retained output collections for the processor instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutputCollections"
        default:
          $ref: "#/components/responses/Error"
  /v1/processors/{processor}/collections/{collection}/entities:
    parameters:
      - $ref: "#/components/parameters/Processor"
      - $ref: "#/components/parameters/Collection"
    get:
      summary: Query processor entities
      operationId: queryProcessorEntities
      description: |
        Without a cursor, reads current retained output in entity-key order
        without creating a snapshot; its `nextCursor` continues that read,
        and later pages see later commits. A cursor from a snapshot reads the
        snapshot's next page. Create a stable snapshot with POST.
      parameters:
        - $ref: "#/components/parameters/FromBlock"
        - $ref: "#/components/parameters/ToBlock"
        - $ref: "#/components/parameters/FromTimestamp"
        - $ref: "#/components/parameters/ToTimestamp"
        - $ref: "#/components/parameters/Limit"
        - name: cursor
          in: query
          schema:
            $ref: "#/components/schemas/Cursor"
      responses:
        "200":
          description: A page of current output, or of a snapshot for a snapshot cursor.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/GenericOutputPage"
                  - $ref: "#/components/schemas/GenericSnapshotPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Snapshot processor entities
      operationId: createProcessorEntitySnapshot
      description: |
        Copies the matching retained output into a stable, short-lived
        snapshot and returns its first page. Read later pages with GET and the
        page's `nextCursor`, and release the snapshot when done. A
        `finalized_only` processor's snapshot holds blocks whose changes are
        not published yet, so it offers no boundary to follow:
        `boundaryCursor` and `recovery.follow` are null.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutputQuery"
      responses:
        "200":
          description: Stable retained-output snapshot page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSnapshotPage"
        "503":
          description: Aggregate query snapshot capacity is full; release snapshots or retry after expiry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        default:
          $ref: "#/components/responses/Error"
  /v1/processors/{processor}/collections/{collection}/entities/{key}:
    parameters:
      - $ref: "#/components/parameters/Processor"
      - $ref: "#/components/parameters/Collection"
      - name: key
        in: path
        required: true
        schema:
          type: string
          pattern: "^0x(?:[0-9a-fA-F]{2})*$"
    get:
      summary: Read a processor entity
      operationId: getProcessorEntity
      responses:
        "200":
          description: One retained processor entity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericOutputEntity"
        default:
          $ref: "#/components/responses/Error"
  /v1/processors/{processor}/collections/{collection}/query-and-follow:
    parameters:
      - $ref: "#/components/parameters/Processor"
      - $ref: "#/components/parameters/Collection"
    post:
      summary: Query a collection and open a race-free follow boundary
      operationId: queryAndFollowProcessorCollection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutputQuery"
      responses:
        "200":
          description: |
            Stable snapshot page plus a change boundary from which following
            begins without a query/stream race.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowSnapshotPage"
        "409":
          description: This processor has delivery disabled; query retained entities without following, or enable delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Aggregate query snapshot capacity is full; release snapshots or retry after expiry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        default:
          $ref: "#/components/responses/Error"
  /v1/processors/{processor}/query-snapshots/{snapshot}:
    parameters:
      - $ref: "#/components/parameters/Processor"
      - name: snapshot
        in: path
        required: true
        schema:
          type: string
          pattern: "^[0-9a-f]{32}$"
    delete:
      summary: Release a processor query snapshot
      operationId: releaseProcessorQuerySnapshot
      parameters:
        - $ref: "#/components/parameters/LeaniRequest"
      responses:
        "204":
          description: Snapshot released.
        default:
          $ref: "#/components/responses/Error"
  /v1/processors/{processor}/checkpoints:
    parameters:
      - $ref: "#/components/parameters/Processor"
    get:
      summary: List processor recovery checkpoints
      operationId: listProcessorRecoveryCheckpoints
      responses:
        "200":
          description: Automatic recovery checkpoints, newest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecoveryCheckpoint"
        default:
          $ref: "#/components/responses/Error"
  /v1/processors/{processor}/checkpoints/{checkpoint}/restore:
    parameters:
      - $ref: "#/components/parameters/Processor"
      - name: checkpoint
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/SafeInteger"
    post:
      summary: Restore a processor recovery checkpoint
      operationId: restoreProcessorRecoveryCheckpoint
      parameters:
        - $ref: "#/components/parameters/LeaniRequest"
      responses:
        "200":
          description: Private state repaired at the exact current cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryRestore"
        default:
          $ref: "#/components/responses/Error"
  /v1/processors/{processor}/savepoints:
    parameters:
      - $ref: "#/components/parameters/Processor"
    get:
      summary: List processor savepoints
      operationId: listProcessorSavepoints
      responses:
        "200":
          description: Operator-created portable savepoints.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PortableSavepoint"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Create a processor savepoint
      operationId: createProcessorSavepoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id]
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        "201":
          description: Portable savepoint created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortableSavepoint"
        "409":
          description: |
            `savepoint_limit`: the processor instance already keeps 16
            savepoints; delete one first. `savepoint_exists`: the ID is taken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "507":
          description: |
            `physical_storage_limit`: the savepoint would exceed the physical
            store budget. Free space or raise the budget first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        default:
          $ref: "#/components/responses/Error"
  /v1/processors/{processor}/savepoints/{savepoint}:
    parameters:
      - $ref: "#/components/parameters/Processor"
      - name: savepoint
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
    get:
      summary: Export a processor savepoint
      operationId: exportProcessorSavepoint
      responses:
        "200":
          description: Checksummed, versioned portable savepoint archive.
          content:
            application/vnd.leani.savepoint:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete a processor savepoint
      operationId: deleteProcessorSavepoint
      parameters:
        - $ref: "#/components/parameters/LeaniRequest"
      responses:
        "204":
          description: Savepoint explicitly deleted.
        default:
          $ref: "#/components/responses/Error"
  /v1/processors/{processor}/consumers:
    parameters:
      - $ref: "#/components/parameters/Processor"
    get:
      summary: List durable consumers
      operationId: listDurableConsumers
      responses:
        "200":
          description: Durable consumers for this processor instance.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DurableConsumer"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Create a durable consumer
      operationId: createDurableConsumer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConsumer"
      responses:
        "201":
          description: Durable consumer registered at the explicit start.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DurableConsumer"
        default:
          $ref: "#/components/responses/Error"
  /v1/processors/{processor}/consumers/{consumer}:
    parameters:
      - $ref: "#/components/parameters/Processor"
      - $ref: "#/components/parameters/Consumer"
    get:
      summary: Read a durable consumer
      operationId: getDurableConsumer
      description: |
        Administrative: only the bearer token protects it, whether or not the
        consumer has a credential, as for the consumer list. A credential
        isolates applications on the consumer-scoped delivery routes.
      responses:
        "200":
          description: Durable consumer state and lag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DurableConsumer"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Revoke a durable consumer
      operationId: revokeDurableConsumer
      description: |
        Administrative: only the bearer token protects it, whether or not the
        consumer has a credential, so an operator can revoke a consumer whose
        credential is lost.
      parameters:
        - $ref: "#/components/parameters/LeaniRequest"
      responses:
        "200":
          description: Consumer explicitly revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DurableConsumer"
        default:
          $ref: "#/components/responses/Error"
  /v1/processors/{processor}/consumers/{consumer}/lease:
    parameters:
      - $ref: "#/components/parameters/Processor"
      - $ref: "#/components/parameters/Consumer"
      - $ref: "#/components/parameters/ConsumerCredential"
    post:
      summary: Renew a durable consumer lease
      operationId: renewDurableConsumerLease
      description: |
        A split live stream fences renewal by session, so its processors get
        409 `consumer_session_required`; renew through
        `/streams/live/consumers/{consumer}/lease` instead.
      parameters:
        - $ref: "#/components/parameters/LeaniRequest"
      responses:
        "200":
          description: Consumer lease renewed without advancing acknowledgement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DurableConsumer"
        default:
          $ref: "#/components/responses/Error"
  /v1/processors/{processor}/consumers/{consumer}/changes:
    parameters:
      - $ref: "#/components/parameters/Processor"
      - $ref: "#/components/parameters/Consumer"
      - $ref: "#/components/parameters/ConsumerCredential"
    get:
      summary: List durable consumer changes
      operationId: listDurableConsumerChanges
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: |
            Replay batch after the acknowledgement. Its last change becomes
            the consumer's delivered sequence, which bounds acknowledgement;
            the acknowledgement does not move.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePage"
        default:
          $ref: "#/components/responses/Error"
  /v1/processors/{processor}/consumers/{consumer}/ack:
    parameters:
      - $ref: "#/components/parameters/Processor"
      - $ref: "#/components/parameters/Consumer"
      - $ref: "#/components/parameters/ConsumerCredential"
    post:
      summary: Acknowledge durable consumer changes
      operationId: acknowledgeDurableConsumerChanges
      description: |
        A cursor beyond the consumer's delivered sequence gets 409
        `acknowledgement_beyond_delivered`. A split live stream fences
        acknowledgement by session, so its processors get 409
        `consumer_session_required`; acknowledge through
        `/streams/live/consumers/{consumer}/ack` instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [cursor]
              properties:
                cursor:
                  $ref: "#/components/schemas/Cursor"
      responses:
        "200":
          description: Cumulative acknowledgement advanced after sink commit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DurableConsumer"
        default:
          $ref: "#/components/responses/Error"
  /v1/processors/{processor}/artifacts/status:
    parameters:
      - $ref: "#/components/parameters/Processor"
    get:
      summary: Read retained processor artifact coverage
      operationId: getProcessorArtifactStatus
      responses:
        "200":
          description: Artifact retention and exact retained ranges.
        default:
          $ref: "#/components/responses/Error"
  /v1/processors/{processor}/artifacts/export:
    parameters:
      - $ref: "#/components/parameters/Processor"
    get:
      summary: Export a retained processor artifact range
      operationId: exportProcessorArtifacts
      responses:
        "200":
          description: Portable processor artifact export.
        default:
          $ref: "#/components/responses/Error"
  /v1/processors/{processor}/artifacts/{block}:
    parameters:
      - $ref: "#/components/parameters/Processor"
      - $ref: "#/components/parameters/Block"
    get:
      summary: Read one retained processor artifact
      operationId: getProcessorArtifact
      responses:
        "200":
          description: Processor artifact for the requested block.
        default:
          $ref: "#/components/responses/Error"
  /v1/processors/{processor}/streams/live/consumers/{consumer}/stream:
    parameters:
      - $ref: "#/components/parameters/Processor"
      - $ref: "#/components/parameters/Consumer"
      - $ref: "#/components/parameters/ConsumerCredential"
    get:
      summary: Stream the dedicated live lane for a durable consumer
      operationId: streamLiveDurableConsumer
      description: |
        Each batch holds one whole block's commit, and records the consumer's
        delivered sequence through it. A request whose `Sec-Fetch-Site` is
        `cross-site` or `same-site` without an allowed `Origin`, such as a
        navigation of another site's frame, gets 403 `cross_site_request`.
        When the node shuts down, the stream ends after a whole record;
        reconnect to resume after the acknowledged cursor.
      responses:
        "200":
          description: |
            Newline-delimited JSON records: first a `hello` with the
            processor's coverage as the session starts, then whole-block
            `batch` records and, while idle, `heartbeat` records. An `error`
            or `reset_required` record ends the stream. A batch of a
            `system.live_gap.put` change announces blocks the live lane
            skipped, which no batch delivers.
          content:
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/LiveStreamRecord"
        default:
          $ref: "#/components/responses/Error"
  /v1/processors/{processor}/streams/live/consumers/{consumer}/ack:
    parameters:
      - $ref: "#/components/parameters/Processor"
      - $ref: "#/components/parameters/Consumer"
      - $ref: "#/components/parameters/ConsumerCredential"
    post:
      summary: Acknowledge a live-lane consumer batch
      operationId: acknowledgeLiveDurableConsumer
      description: |
        The cursor must end a block's commit, as a batch's
        `acknowledgeableCursor` does, and gets 409
        `acknowledgement_mid_block` otherwise. A cursor beyond the consumer's
        delivered sequence gets 409 `acknowledgement_beyond_delivered`.
      responses:
        "200":
          description: Updated live-lane acknowledgement state.
        default:
          $ref: "#/components/responses/Error"
  /v1/processors/{processor}/streams/live/consumers/{consumer}/lease:
    parameters:
      - $ref: "#/components/parameters/Processor"
      - $ref: "#/components/parameters/Consumer"
      - $ref: "#/components/parameters/ConsumerCredential"
    post:
      summary: Renew a live-lane consumer lease
      operationId: renewLiveDurableConsumerLease
      parameters:
        - $ref: "#/components/parameters/LeaniRequest"
      responses:
        "200":
          description: Renewed live-lane lease.
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Release a live-lane consumer lease
      operationId: releaseLiveDurableConsumerLease
      parameters:
        - $ref: "#/components/parameters/LeaniRequest"
      responses:
        "200":
          description: Released live-lane lease.
        default:
          $ref: "#/components/responses/Error"
  /v1/backfill-subscriptions/{subscription}/consumers/{consumer}/changes:
    parameters:
      - $ref: "#/components/parameters/Subscription"
      - $ref: "#/components/parameters/Consumer"
      - $ref: "#/components/parameters/ConsumerCredential"
    get:
      summary: Poll changes from one backfill subscription
      operationId: listBackfillConsumerChanges
      responses:
        "200":
          description: Retained backfill delivery batches.
        default:
          $ref: "#/components/responses/Error"
  /v1/backfill-subscriptions/{subscription}/consumers/{consumer}/stream:
    parameters:
      - $ref: "#/components/parameters/Subscription"
      - $ref: "#/components/parameters/Consumer"
      - $ref: "#/components/parameters/ConsumerCredential"
    get:
      summary: Stream changes from one backfill subscription
      operationId: streamBackfillConsumer
      description: |
        Each batch and the completion record the consumer's delivered
        sequence through their acknowledgement boundary. A request whose
        `Sec-Fetch-Site` is `cross-site` or `same-site` without an allowed
        `Origin`, such as a navigation of another site's frame, gets 403
        `cross_site_request`. When the node shuts down, the stream ends after
        a whole record; reconnect to resume after the acknowledged cursor.
      responses:
        "200":
          description: Server-sent backfill delivery batches.
        default:
          $ref: "#/components/responses/Error"
  /v1/backfill-subscriptions/{subscription}/consumers/{consumer}/ack:
    parameters:
      - $ref: "#/components/parameters/Subscription"
      - $ref: "#/components/parameters/Consumer"
      - $ref: "#/components/parameters/ConsumerCredential"
    post:
      summary: Acknowledge a backfill subscription batch
      operationId: acknowledgeBackfillConsumer
      description: |
        The cursor must be a batch's `acknowledgeableCursor` or the
        completion's `cursor` (409 `acknowledgement_invalid` otherwise), and
        not beyond the consumer's delivered sequence (409
        `acknowledgement_beyond_delivered`).
      responses:
        "200":
          description: Updated backfill acknowledgement state.
        default:
          $ref: "#/components/responses/Error"
  /v1/backfill-subscriptions/{subscription}/consumers/{consumer}/lease:
    parameters:
      - $ref: "#/components/parameters/Subscription"
      - $ref: "#/components/parameters/Consumer"
      - $ref: "#/components/parameters/ConsumerCredential"
    post:
      summary: Renew a backfill consumer lease
      operationId: renewBackfillConsumerLease
      parameters:
        - $ref: "#/components/parameters/LeaniRequest"
      responses:
        "200":
          description: Renewed backfill lease.
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Release a backfill consumer lease
      operationId: releaseBackfillConsumerLease
      parameters:
        - $ref: "#/components/parameters/LeaniRequest"
      responses:
        "200":
          description: Released backfill lease.
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/processors/{processor}/lanes/live/reset:
    parameters:
      - $ref: "#/components/parameters/Processor"
    post:
      summary: Reset a processor live lane for replay
      operationId: resetProcessorLiveLane
      parameters:
        - $ref: "#/components/parameters/LeaniRequest"
      responses:
        "200":
          description: Paused live-lane reset state.
        "409":
          description: |
            The lane cannot be reset. `single_block_exceeds_delivery_limit`:
            its first unapplied block still exceeds the delivery limit; raise
            the limit first. `live_lane_requires_rebuild`: the lane failed with
            `processor_finality_conflict`, so its coverage contradicts the
            canonical chain; rebuild the processor as a replacement instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/processors/{processor}/artifacts:
    parameters:
      - $ref: "#/components/parameters/Processor"
    delete:
      summary: Delete retained processor artifacts
      operationId: deleteProcessorArtifacts
      parameters:
        - $ref: "#/components/parameters/LeaniRequest"
      responses:
        "200":
          description: Artifact deletion result.
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/processors/{processor}/artifacts/replay:
    parameters:
      - $ref: "#/components/parameters/Processor"
    post:
      summary: Replay retained processor artifacts
      operationId: replayProcessorArtifacts
      responses:
        "200":
          description: Created artifact replay job.
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/backfill-subscriptions:
    get:
      summary: List backfill subscriptions
      operationId: listBackfillSubscriptions
      responses:
        "200":
          description: Backfill subscriptions.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/BackfillStatus"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Create a backfill subscription
      operationId: createBackfillSubscription
      description: |
        A new subscription's consumer `credential` holds 32 to 512 printable
        ASCII characters without spaces (400 otherwise). Re-submitting an
        existing subscription's request unchanged returns its status, even
        with a credential from before that rule. The credential enters the
        request's idempotency identity, an unkeyed BLAKE3 hash of the whole
        request that the node keeps, so use a random one.

        A range that starts past the node's finalized head gets 409
        `range_after_finalized_head`, and one that only ends past it
        `history_not_finalized`. Their `details.currentFinalizedHead` holds
        the head's `number` and its `hash` as `0x` hex.
      responses:
        "202":
          description: Backfill subscription accepted; its current status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackfillStatus"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/backfill-subscriptions/{id}:
    parameters:
      - $ref: "#/components/parameters/Identifier"
    get:
      summary: Inspect a backfill subscription
      operationId: getBackfillSubscription
      responses:
        "200":
          description: Backfill subscription state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackfillStatus"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete a terminal backfill subscription
      operationId: deleteBackfillSubscription
      description: |
        A completed subscription can be deleted once its consumer acknowledged
        the completion. A failed or cancelled one can be deleted once its
        required consumer acknowledged every delivered record, and gets 409
        `backfill_conflict` while one is unacknowledged: read its stream to
        the end and acknowledge, or pass `discardUnacknowledged=true`.
      parameters:
        - $ref: "#/components/parameters/LeaniRequest"
        - name: discardUnacknowledged
          in: query
          description: |
            Delete a failed or cancelled subscription although its required
            consumer has not acknowledged every record. Has no effect on a
            subscription that is still running.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Deleted backfill subscription.
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/backfill-subscriptions/{id}/retry:
    parameters:
      - $ref: "#/components/parameters/Identifier"
    post:
      summary: Retry a failed backfill subscription
      operationId: retryBackfillSubscription
      description: |
        Re-queues a failed subscription. It resumes from its committed
        progress with the same history stream, consumer, and acknowledgement,
        and its error is cleared. A subscription that is still active returns
        its status unchanged; a completed or cancelled one gets 409
        `backfill_conflict`.
      parameters:
        - $ref: "#/components/parameters/LeaniRequest"
      responses:
        "200":
          description: Retried backfill subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackfillStatus"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/backfill-subscriptions/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/Identifier"
    post:
      summary: Cancel a backfill subscription
      operationId: cancelBackfillSubscription
      parameters:
        - $ref: "#/components/parameters/LeaniRequest"
      responses:
        "200":
          description: Cancelled backfill subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackfillStatus"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/materialization-jobs:
    get:
      summary: List materialization jobs
      operationId: listMaterializationJobs
      responses:
        "200":
          description: Materialization jobs.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/BackfillStatus"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Create a materialization job
      operationId: createMaterializationJob
      description: |
        A range that starts past the node's finalized head gets 409
        `range_after_finalized_head`, and one that only ends past it
        `history_not_finalized`. Their `details.currentFinalizedHead` holds
        the head's `number` and its `hash` as `0x` hex.
      responses:
        "202":
          description: Materialization job accepted; its current status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackfillStatus"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/materialization-jobs/{id}:
    parameters:
      - $ref: "#/components/parameters/Identifier"
    get:
      summary: Inspect a materialization job
      operationId: getMaterializationJob
      responses:
        "200":
          description: Materialization job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackfillStatus"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete a terminal materialization job
      operationId: deleteMaterializationJob
      parameters:
        - $ref: "#/components/parameters/LeaniRequest"
      responses:
        "200":
          description: Deleted materialization job.
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/materialization-jobs/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/Identifier"
    post:
      summary: Cancel a materialization job
      operationId: cancelMaterializationJob
      parameters:
        - $ref: "#/components/parameters/LeaniRequest"
      responses:
        "200":
          description: Cancelled materialization job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackfillStatus"
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/raw-history-jobs:
    get:
