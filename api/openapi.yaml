        nextCursor:
          oneOf:
            - $ref: "#/components/schemas/Cursor"
            - type: "null"
        coverage:
          $ref: "#/components/schemas/ProcessorCoverage"
    ChangePage:
      type: object
      additionalProperties: false
      required: [data, nextCursor, coverage]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ChangeEnvelope"
        nextCursor:
          oneOf:
            - $ref: "#/components/schemas/Cursor"
            - type: "null"
        coverage:
          $ref: "#/components/schemas/ProcessorCoverage"
    ErrorBody:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, retryable, requestId]
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
            details:
              oneOf:
                - type: object
                  additionalProperties: true
                - type: "null"
            requestId:
              type: string
