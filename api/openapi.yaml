        default:
          $ref: "#/components/responses/Error"
  /admin/v1/raw-history-jobs/{id}:
    parameters:
      - $ref: "#/components/parameters/Identifier"
    get:
      summary: Inspect a raw-history job
      operationId: getRawHistoryJob
      responses:
        "200":
          description: Raw-history job state.
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete a terminal raw-history job
      operationId: deleteRawHistoryJob
      parameters:
        - $ref: "#/components/parameters/LeaniRequest"
      responses:
        "200":
          description: Deleted raw-history job.
        default:
          $ref: "#/components/responses/Error"
  /admin/v1/raw-history-jobs/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/Identifier"
    post:
      summary: Cancel a raw-history job
      operationId: cancelRawHistoryJob
