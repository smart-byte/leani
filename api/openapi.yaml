    ChangeBlock:
      type: object
      additionalProperties: false
      required: [number, hash, parentHash, timestamp]
      properties:
        number:
          $ref: "#/components/schemas/SafeInteger"
        hash:
          $ref: "#/components/schemas/Hash32"
        parentHash:
          $ref: "#/components/schemas/Hash32"
        timestamp:
          $ref: "#/components/schemas/SafeInteger"
    ChangeEnvelope:
      type: object
      additionalProperties: false
      required:
        [apiVersion, sequence, cursor, operation, originKind, originId, publicationRevision, chainId, block, finality, kind, schema, key, data, emittedAt]
      properties:
        apiVersion:
          const: "1"
        sequence:
          $ref: "#/components/schemas/DecimalQuantity"
        cursor:
          $ref: "#/components/schemas/Cursor"
        operation:
          type: string
          enum: [apply, undo, finalized, reset_required]
        originKind:
          type: string
          enum: [live, live_recovery, historical_backfill, recompute]
          description: Processing lane that produced this publication.
        originId:
          type: string
          description: Durable identity of the live lane, recovery, subscription, or recompute job.
        publicationRevision:
          $ref: "#/components/schemas/DecimalQuantity"
        chainId:
          $ref: "#/components/schemas/SafeInteger"
        block:
          oneOf:
            - $ref: "#/components/schemas/ChangeBlock"
            - type: "null"
        finality:
          $ref: "#/components/schemas/Finality"
        kind:
          type: string
        schema:
          type: string
          description: Versioned processor change schema identifier.
        key:
          oneOf:
            - type: string
              pattern: "^0x[0-9a-f]*$"
            - type: "null"
        data: {}
        coverage:
          $ref: "#/components/schemas/ProcessorCoverage"
          description: Present only on reset_required events.
        emittedAt:
          type: string
          description: Stable emission timestamp.
    ChangeHead:
      type: object
      additionalProperties: false
      required: [earliestSequence, latestSequence, cursor]
      properties:
        earliestSequence:
          oneOf:
            - $ref: "#/components/schemas/DecimalQuantity"
            - type: "null"
        latestSequence:
          oneOf:
            - $ref: "#/components/schemas/DecimalQuantity"
            - type: "null"
        cursor:
          oneOf:
            - $ref: "#/components/schemas/Cursor"
            - type: "null"
