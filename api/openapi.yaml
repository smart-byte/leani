          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlobBlockPage"
        "409":
          description: The range contains unindexed gaps.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        default:
          $ref: "#/components/responses/Error"
  /v1/q/blobs/blocks/{number}:
    parameters:
      - name: number
        in: path
