version: 2
updates:
  # Workflow actions stay pinned to full commit SHAs; Dependabot updates the
  # SHA together with its version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # These packages share Arrow and ObjectStore types across crate boundaries.
    groups:
      arrow-parquet:
        patterns:
          - "arrow-*"
          - "parquet"
          - "object_store"
  - package-ecosystem: bun
    directories:
      - /packages/sdk
      - /site
    schedule:
      interval: weekly
    # Starlight releases require compatible Astro and markdown integrations.
    groups:
      astro-starlight:
        patterns:
          - "astro"
          - "@astrojs/starlight"
          - "@astrojs/mdx"
          - "@astrojs/markdown-*"
          - "astro-expressive-code"
          - "starlight-llms-txt"
    # TypeScript 5 provides the JavaScript compiler API required by
    # openapi-typescript and Astro; the native CLI is tracked separately
    # through @typescript/native. Review compiler API migrations explicitly.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  # Refreshes the Dockerfile's digest-pinned base images. CI rejects a rust
  # tag update until rust-toolchain.toml moves to the same version with it.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
