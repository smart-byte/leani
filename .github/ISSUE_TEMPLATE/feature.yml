name: Feature proposal
description: Propose a source, processor, store, API, or operational capability
title: "proposal: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user outcome or reliability/cost constraint, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Proposed contract
      description: Note capability, trust, ordering, durability, retention, and resource-bound implications.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and evidence
      description: Include representative workloads or measurements when performance is part of the proposal.

