name: Prepare release
run-name: ${{ inputs.release_request && format('Prepare release [{0}]', inputs.release_request) || '' }}

on:
  workflow_dispatch:
    inputs:
      container_candidate_run_id:
        description: Successful container preparation run ID (required when publishing)
        required: false
        type: string
      release_request:
        description: Correlation ID used by the release coordinator
        required: false
        type: string
      version:
        description: SemVer tag to package (for example v0.1.0-rc.1)
        required: true
        type: string
      publish:
        description: Publish an already prepared candidate without rebuilding it
        required: true
        default: false
        type: boolean
      candidate_run_id:
        description: Successful preparation run ID (required when publishing)
        required: false
        type: string

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify publication history
        run: scripts/check-publication.rb HEAD
      - name: Validate version and publish ref
        env:
          PUBLISH: ${{ inputs.publish }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          case "$RELEASE_VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "version must start with a v-prefixed SemVer" >&2; exit 1 ;;
          esac
          if [ "$PUBLISH" = "true" ] && [ "$GITHUB_REF" != "refs/tags/$RELEASE_VERSION" ]; then
            echo "publishing requires dispatching this workflow from refs/tags/$RELEASE_VERSION" >&2
            exit 1
          fi
          if [ "$PUBLISH" = "true" ] && [ -z "$CANDIDATE_RUN_ID" ]; then
            echo "publishing requires a verified candidate_run_id" >&2
            exit 1
          fi
          package_version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "leani") | .version')
          if [ "$RELEASE_VERSION" != "v$package_version" ]; then
            echo "release version $RELEASE_VERSION does not match leani package version v$package_version" >&2
            exit 1
          fi
      - name: Require passing CI and matching candidate
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CONTAINER_CANDIDATE_RUN_ID: ${{ inputs.container_candidate_run_id }}
        run: ruby scripts/check-release-ci.rb

  archive:
    name: ${{ matrix.target }} archive
    needs: [validate, sbom]
    if: ${{ !inputs.publish }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add ${{ matrix.target }}
      - name: Build release binary
        env:
          CARGO_INCREMENTAL: "0"
          LEANI_GIT_COMMIT: ${{ github.sha }}
        run: |
          export RUSTFLAGS="--remap-path-prefix=$HOME=/build --remap-path-prefix=$GITHUB_WORKSPACE=/source"
          export CFLAGS="-ffile-prefix-map=$HOME=/build -ffile-prefix-map=$GITHUB_WORKSPACE=/source"
          export CXXFLAGS="$CFLAGS"
          cargo build --locked --release --target ${{ matrix.target }} -p leani
          ruby scripts/check-artifact-privacy.rb target/${{ matrix.target }}/release/leani
      # The floor is the glibc of the ubuntu-24.04 build image. The supported
      # distributions in docs/getting-started/install.mdx follow from it.
      - name: Enforce the documented glibc floor
        if: runner.os == 'Linux'
        run: ruby scripts/check-glibc-floor.rb target/${{ matrix.target }}/release/leani 2.39
      - name: Package and checksum
        run: |
          install -d dist
          cp target/${{ matrix.target }}/release/leani dist/
          cp LICENSE README.md THIRD_PARTY_LICENSES.txt dist/
          archive="leani-${RELEASE_VERSION}-${{ matrix.target }}.tar.gz"
          tar -C dist -czf "$archive" .
          shasum -a 256 "$archive" > "$archive.sha256"
          install -d unpacked
          tar -xzf "$archive" -C unpacked
          unpacked/leani --version
          unpacked/leani e2e fixture \
            --blocks 128 --data-dir "$RUNNER_TEMP/leani-archive-fixture" \
            --report "$RUNNER_TEMP/leani-archive-fixture.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leani-${{ matrix.target }}
          path: |
            leani-*.tar.gz
            leani-*.sha256
          if-no-files-found: error
          retention-days: 14

  sbom:
    name: Software bill of materials
    needs: validate
    if: ${{ !inputs.publish }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - run: cargo cyclonedx --format json --all
      - name: Prepare portable SBOM assets
        run: |
          ruby scripts/prepare-sbom.rb sbom-assets "$GITHUB_WORKSPACE" \
            crates/*/*.cdx.json examples/*/*.cdx.json
          # cargo-cyclonedx names each SBOM after its package; the node is leani.
          test -f sbom-assets/leani.cdx.json || { echo "missing the node SBOM leani.cdx.json" >&2; exit 1; }
      - name: Verify and include dependency license notices
        run: |
          sh scripts/install-cargo-about.sh "$RUNNER_TEMP/license-tools"
          python3 scripts/generate-third-party-licenses.py --check \
            --cargo-about "$RUNNER_TEMP/license-tools/cargo-about"
          cp THIRD_PARTY_LICENSES.txt sbom-assets/
          ruby scripts/check-artifact-privacy.rb sbom-assets
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leani-sbom
          path: sbom-assets/
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Assemble release and Homebrew formula
    needs: [archive, sbom]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: leani-*
          path: release-assets
          merge-multiple: true
      - name: Verify archives and collect checksums
        run: |
          cd release-assets
          for checksum in leani-*.sha256; do sha256sum --check "$checksum"; done
          awk '{ print $1 "  " $2 }' leani-*.sha256 | sort -k2 > SHA256SUMS
      - name: Render Homebrew formula
        run: |
          scripts/render-homebrew-formula.sh \
            "$RELEASE_VERSION" \
            "${{ github.repository }}" \
            release-assets/SHA256SUMS \
            release-assets/leani.rb
      - name: Inspect public metadata
        run: |
          ruby scripts/check-artifact-privacy.rb \
            release-assets/*.cdx.json release-assets/THIRD_PARTY_LICENSES.txt \
            release-assets/leani.rb release-assets/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leani-release-candidate-${{ inputs.version }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  # The only job that can write the release or sign attestations. It publishes
  # the candidate that a successful preparation run of this commit built and
  # tested, without rebuilding it.
  publish:
    name: Publish GitHub release
    if: ${{ inputs.publish }}
    needs: validate
    runs-on: ubuntu-24.04
    environment: release-github
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: leani-release-candidate-${{ inputs.version }}
          path: release-assets
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Verify candidate checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS
      - name: Require flat release assets with the node SBOM
        run: |
          if find release-assets -mindepth 1 -type d | grep -q .; then
            echo "release assets must be files, without nested directories" >&2
            exit 1
          fi
          test -f release-assets/leani.cdx.json || { echo "the release candidate must carry the node SBOM leani.cdx.json" >&2; exit 1; }
      - name: Attest archive provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/leani-*.tar.gz
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A retry can finish a partially uploaded draft, but must never
          # replace an existing asset or publish a different candidate.
          # releases/tags/{tag} hides drafts, so list releases instead.
          # ponytail: newest 100 releases; a retry follows its draft closely.
          # shellcheck disable=SC2016 # jq reads $ENV itself
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select(.tag_name == $ENV.RELEASE_VERSION)]' > matching-releases.json
          case "$(jq length matching-releases.json)" in
            0)
              gh release create "$RELEASE_VERSION" release-assets/* \
                --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes \
                --title "Leani $RELEASE_VERSION"
              ;;
            1)
              jq '.[0]' matching-releases.json > existing-release.json
              jq -r '.assets[] | [.name, .id, .digest // ""] | @tsv' existing-release.json > existing-assets.tsv
              while IFS=$'\t' read -r name id digest; do
                case "$name" in */*|.*) echo "unexpected release asset" >&2; exit 1 ;; esac
                test -f "release-assets/$name" || { echo "unexpected release asset $name" >&2; exit 1; }
                if [ -z "$digest" ]; then
                  gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$id" > existing-asset
                  digest="sha256:$(sha256sum existing-asset | cut -d' ' -f1)"
                fi
                test "$digest" = "sha256:$(sha256sum "release-assets/$name" | cut -d' ' -f1)" || { echo "existing release asset differs: $name" >&2; exit 1; }
              done < existing-assets.tsv
              for asset in release-assets/*; do
                name=${asset##*/}
                if ! cut -f1 existing-assets.tsv | grep -Fxq "$name"; then
                  test "$(jq -r .draft existing-release.json)" = true || { echo "published release is incomplete" >&2; exit 1; }
                  gh release upload "$RELEASE_VERSION" "$asset" --repo "$GITHUB_REPOSITORY"
                fi
              done
              ;;
            *) echo "several releases use $RELEASE_VERSION; delete the extra drafts" >&2; exit 1 ;;
          esac
          case "${RELEASE_VERSION%%+*}" in
            *-*) prerelease=true; latest=false ;;
            *) prerelease=false; latest=true ;;
          esac
          gh release edit "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease="$prerelease" --latest="$latest"
