name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer tag to package (for example v0.1.0-rc.1)
        required: true
        type: string
      publish:
        description: Publish an already prepared candidate without rebuilding it
        required: true
        default: false
        type: boolean
      candidate_run_id:
        description: Successful preparation run ID (required when publishing)
        required: false
        type: string

permissions:
  contents: read
  actions: read

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Verify publication history
        run: scripts/check-publication.rb HEAD
      - name: Validate version and publish ref
        env:
          PUBLISH: ${{ inputs.publish }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          case "$RELEASE_VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "version must start with a v-prefixed SemVer" >&2; exit 1 ;;
          esac
          if [ "$PUBLISH" = "true" ] && [ "$GITHUB_REF" != "refs/tags/$RELEASE_VERSION" ]; then
            echo "publishing requires dispatching this workflow from refs/tags/$RELEASE_VERSION" >&2
            exit 1
          fi
          if [ "$PUBLISH" = "true" ] && [ -z "$CANDIDATE_RUN_ID" ]; then
            echo "publishing requires a verified candidate_run_id" >&2
            exit 1
          fi
          package_version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "leani") | .version')
          if [ "$RELEASE_VERSION" != "v$package_version" ]; then
            echo "release version $RELEASE_VERSION does not match leani package version v$package_version" >&2
            exit 1
          fi
      - name: Require passing CI and matching candidate
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: ruby scripts/check-release-ci.rb

  archive:
    name: ${{ matrix.target }} archive
    needs: [validate, sbom]
    if: ${{ !inputs.publish }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: leani-sbom
          path: notices
      - run: rustup target add ${{ matrix.target }}
      - name: Build release binary
        env:
          CARGO_INCREMENTAL: "0"
          LEANI_GIT_COMMIT: ${{ github.sha }}
        run: |
          export RUSTFLAGS="--remap-path-prefix=$HOME=/build --remap-path-prefix=$GITHUB_WORKSPACE=/source"
          export CFLAGS="-ffile-prefix-map=$HOME=/build -ffile-prefix-map=$GITHUB_WORKSPACE=/source"
          export CXXFLAGS="$CFLAGS"
          cargo build --locked --release --target ${{ matrix.target }} -p leani
          ruby scripts/check-artifact-privacy.rb target/${{ matrix.target }}/release/leani
      - name: Package and checksum
        run: |
          install -d dist
          cp target/${{ matrix.target }}/release/leani dist/
          cp LICENSE README.md dist/
          cp notices/THIRD_PARTY_LICENSES.txt dist/
          archive="leani-${RELEASE_VERSION}-${{ matrix.target }}.tar.gz"
          tar -C dist -czf "$archive" .
          shasum -a 256 "$archive" > "$archive.sha256"
          install -d unpacked
          tar -xzf "$archive" -C unpacked
          unpacked/leani --version
          unpacked/leani e2e fixture \
            --blocks 128 --data-dir "$RUNNER_TEMP/leani-archive-fixture" \
            --report "$RUNNER_TEMP/leani-archive-fixture.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leani-${{ matrix.target }}
          path: |
            leani-*.tar.gz
            leani-*.sha256
          if-no-files-found: error
          retention-days: 14

  sbom:
    name: Software bill of materials
    needs: validate
    if: ${{ !inputs.publish }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - run: cargo cyclonedx --format json --all
      - name: Prepare portable SBOM assets
        run: |
          ruby scripts/prepare-sbom.rb sbom-assets "$GITHUB_WORKSPACE" \
            crates/*/*.cdx.json examples/*/*.cdx.json
      - name: Include dependency license notices
        run: |
          sh scripts/install-cargo-about.sh "$RUNNER_TEMP/license-tools"
          "$RUNNER_TEMP/license-tools/cargo-about" generate --locked --fail \
            --manifest-path crates/node/Cargo.toml --config about.toml \
            about.hbs --output-file sbom-assets/THIRD_PARTY_LICENSES.txt
          ruby scripts/check-artifact-privacy.rb sbom-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leani-sbom
          path: sbom-assets/
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Assemble release and Homebrew formula
    needs: [archive, sbom]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: leani-*
          path: release-assets
          merge-multiple: true
      - name: Verify archives and collect checksums
        run: |
          cd release-assets
          for checksum in leani-*.sha256; do sha256sum --check "$checksum"; done
          awk '{ print $1 "  " $2 }' leani-*.sha256 | sort -k2 > SHA256SUMS
      - name: Render Homebrew formula
        run: |
          scripts/render-homebrew-formula.sh \
            "$RELEASE_VERSION" \
            "${{ github.repository }}" \
            release-assets/SHA256SUMS \
            release-assets/leani.rb
      - name: Inspect public metadata
        run: |
          ruby scripts/check-artifact-privacy.rb \
            release-assets/*.cdx.json release-assets/THIRD_PARTY_LICENSES.txt \
            release-assets/leani.rb release-assets/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leani-release-candidate-${{ inputs.version }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: ${{ inputs.publish }}
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: leani-release-candidate-${{ inputs.version }}
          path: release-assets
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Verify candidate checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS
      - name: Require flat release assets
        run: |
          if find release-assets -mindepth 1 -type d | grep -q .; then
            echo "release assets must be files, without nested directories" >&2
            exit 1
          fi
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_VERSION" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "Leani $RELEASE_VERSION"
          case "${RELEASE_VERSION%%+*}" in
            *-*) prerelease=true; latest=false ;;
            *) prerelease=false; latest=true ;;
          esac
          gh release edit "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease="$prerelease" --latest="$latest"
