name: Promote release site

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published Leani release tag to promote (for example v0.1.0-rc.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: site-production-promotion
  cancel-in-progress: false

jobs:
  validate:
    name: Validate and build the release site
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    outputs:
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "release_tag must be a v-prefixed SemVer" >&2; exit 1 ;;
          esac
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
          scripts/verify-site-production.rb "$RELEASE_TAG"
          git fetch origin site-production:refs/remotes/origin/site-production || true
          if git show-ref --verify --quiet refs/remotes/origin/site-production; then
            git merge-base --is-ancestor refs/remotes/origin/site-production "$RELEASE_TAG^{commit}"
          fi
          git checkout --detach "$RELEASE_TAG^{commit}"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: site/.bun-version
      - name: Install site dependencies
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Validate release-pinned production site
        working-directory: site
        env:
          LEANI_SITE_MODE: production
          LEANI_DOCS_REF: ${{ inputs.release_tag }}
        run: |
          ../scripts/check-publication.rb HEAD
          ../scripts/verify-site-production.rb "$RELEASE_TAG"
          bun run check
          bun run examples:check
          bun run build
          bun run size:check
          bun run search:check

  # The only job with a write token. It runs no project code; it only moves
  # site-production to the release commit that the validate job built.
  promote:
    name: Fast-forward site-production
    needs: validate
    runs-on: ubuntu-24.04
    environment: site-production
    permissions:
      contents: write
    steps:
      - name: Promote exact release commit
        env:
          GH_TOKEN: ${{ secrets.SITE_PROMOTION_TOKEN || github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$RELEASE_COMMIT"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/site-production" --silent; then
            # force=false makes GitHub refuse anything but a fast-forward.
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/site-production" \
              -f sha="$RELEASE_COMMIT" -F force=false --silent
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/heads/site-production -f sha="$RELEASE_COMMIT" --silent
          fi
