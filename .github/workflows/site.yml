name: Site and documentation

on:
  push:
    branches: [main, site-production]
    paths:
      - "site/**"
      - "docs/**"
      - "examples/**"
      - "api/openapi.yaml"
      - "config/schema-v1.json"
      - "packages/sdk/src/**"
      - "scripts/docs/**"
      - "scripts/check-publication.rb"
      - "scripts/verify-site-production.rb"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "examples/**"
      - "api/openapi.yaml"
      - "config/schema-v1.json"
      - "packages/sdk/src/**"
      - "scripts/docs/**"
      - "scripts/check-publication.rb"
      - "scripts/verify-site-production.rb"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Bun-only static site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: site/.bun-version
      - name: Verify publication history
        run: scripts/check-publication.rb HEAD
      - name: Verify production ref
        if: github.ref == 'refs/heads/site-production'
        run: scripts/verify-site-production.rb HEAD
      - name: Resolve documentation version
        run: |
          if [ "$GITHUB_REF" = "refs/heads/site-production" ]; then
            docs_ref=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$')
            echo "LEANI_SITE_MODE=production" >> "$GITHUB_ENV"
            echo "LEANI_DOCS_REF=$docs_ref" >> "$GITHUB_ENV"
          else
            echo "LEANI_SITE_MODE=preview" >> "$GITHUB_ENV"
            echo "LEANI_DOCS_REF=main" >> "$GITHUB_ENV"
          fi
      - name: Install site dependencies
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Validate docs and site
        working-directory: site
        run: bun run check
      - name: Verify cross-root docs watching
        working-directory: site
        run: bun run docs:watch-check
      - name: Build static site
        working-directory: site
        run: bun run build
      - name: Verify static search
        working-directory: site
        run: bun run search:check
