name: Scheduled performance evidence

on:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-million:
    name: ${{ matrix.case }} / ${{ matrix.corpus }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        case: [acquire, raw-only, materialized, compact-artifact, compact-artifact-segment, compact-artifact-tiered, raw-artifact, raw-materialized, raw-artifact-materialized, deliver, end-to-end-fast-consumer, end-to-end-slow-consumer, end-to-end-postgres, raw-externalized, end-to-end-blobs-application]
        corpus: [zero, uniswap-like, blobs-like]
        exclude:
          - case: end-to-end-blobs-application
            corpus: zero
          - case: end-to-end-blobs-application
            corpus: uniswap-like
        include:
          - case: acquire
            mode: acquire
            profile: acquire-discard
            destination: rust-direct
          - case: raw-only
            mode: acquire
            profile: raw-only
            destination: rust-direct
          - case: materialized
            mode: process
            profile: materialized
            destination: rust-direct
          - case: compact-artifact
            mode: process
            profile: compact-artifact
            destination: rust-direct
          - case: compact-artifact-segment
            mode: process
            profile: compact-artifact-segment
            destination: rust-direct
          - case: compact-artifact-tiered
            mode: process
            profile: compact-artifact-tiered
            destination: rust-direct
          - case: raw-artifact
            mode: process
            profile: raw-artifact
            destination: rust-direct
          - case: raw-materialized
            mode: process
            profile: raw-materialized
            destination: rust-direct
          - case: raw-artifact-materialized
            mode: process
            profile: raw-artifact-materialized
            destination: rust-direct
          - case: deliver
            mode: deliver
            profile: externalized
            destination: rust-http
          - case: end-to-end-fast-consumer
            mode: end-to-end
            profile: externalized
            destination: rust-http
            consumer_delay_ms: 0
          - case: end-to-end-slow-consumer
            mode: end-to-end
            profile: externalized
            destination: rust-http
            consumer_delay_ms: 100
          - case: end-to-end-postgres
            mode: end-to-end
            profile: externalized
            destination: sdk-postgres
          - case: raw-externalized
            mode: end-to-end
            profile: raw-externalized
            destination: sdk-postgres
          - case: end-to-end-blobs-application
            mode: end-to-end
            profile: externalized
            destination: sdk-postgres
            postgres_schema: blobs-application
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: leani_benchmark
          POSTGRES_USER: leani_benchmark
          POSTGRES_PASSWORD: leani_benchmark
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leani_benchmark -d leani_benchmark"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    env:
      LEANI_BENCHMARK_POSTGRES_URL: postgres://leani_benchmark:leani_benchmark@127.0.0.1:5432/leani_benchmark
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: packages/sdk/.bun-version
      - name: Install SDK dependencies
        working-directory: packages/sdk
        run: bun install --frozen-lockfile
      - name: Build release benchmark
        run: cargo build --release --locked -p leani
      - name: Run one-million-block benchmark
        run: >-
          target/release/leani benchmark
          --mode ${{ matrix.mode }}
          --profile ${{ matrix.profile }}
          --destination ${{ matrix.destination }}
          --postgres-schema ${{ matrix.postgres_schema || 'generic-event-log' }}
          --corpus ${{ matrix.corpus }}
          --blocks 1000000
          --chunk-blocks 8192
          --artifact-segment-blocks 2048
          --artifact-compaction-interval-ms 100
          --artifact-compaction-maximum-segments-per-cycle 4
          --consumer-delay-ms ${{ matrix.consumer_delay_ms || 0 }}
          --warmups 1
          --runs 3
          --sample-interval-ms 200
          --samples-report benchmark-${{ matrix.case }}-${{ matrix.corpus }}-samples.ndjson
          --report benchmark-${{ matrix.case }}-${{ matrix.corpus }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-${{ matrix.case }}-${{ matrix.corpus }}
          path: |
            benchmark-${{ matrix.case }}-${{ matrix.corpus }}.json
            benchmark-${{ matrix.case }}-${{ matrix.corpus }}-samples.ndjson
          if-no-files-found: error

  delivery-faults:
    name: delivery faults / ${{ matrix.corpus }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        corpus: [uniswap-like, blobs-like]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: leani_benchmark
          POSTGRES_USER: leani_benchmark
          POSTGRES_PASSWORD: leani_benchmark
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leani_benchmark -d leani_benchmark"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    env:
      LEANI_BENCHMARK_POSTGRES_URL: postgres://leani_benchmark:leani_benchmark@127.0.0.1:5432/leani_benchmark
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: packages/sdk/.bun-version
      - name: Install SDK dependencies
        working-directory: packages/sdk
        run: bun install --frozen-lockfile
      - name: Build release benchmark
        run: cargo build --release --locked -p leani
      - name: Exercise live priority, reconnect, and lost-ack recovery
        run: >-
          target/release/leani benchmark
          --mode end-to-end
          --profile externalized
          --destination sdk-postgres
          --corpus ${{ matrix.corpus }}
          --blocks 10000
          --chunk-blocks 2048
          --warmups 0
          --runs 1
          --sample-interval-ms 100
          --consumer-delay-ms 25
          --consumer-reconnect-every-batches 2
          --consumer-drop-ack-response-once
          --concurrent-live-blocks 100
          --live-block-interval-ms 5
          --samples-report benchmark-delivery-faults-${{ matrix.corpus }}-samples.ndjson
          --report benchmark-delivery-faults-${{ matrix.corpus }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-delivery-faults-${{ matrix.corpus }}
          path: |
            benchmark-delivery-faults-${{ matrix.corpus }}.json
            benchmark-delivery-faults-${{ matrix.corpus }}-samples.ndjson
          if-no-files-found: error
