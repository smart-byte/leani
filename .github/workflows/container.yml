name: Container candidate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable image tag (normally the matching v-prefixed release tag)
        required: true
        default: candidate
        type: string
      publish:
        description: Publish the two images from a successful candidate run
        required: true
        default: false
        type: boolean
      candidate_run_id:
        description: Successful preparation run ID (required when publishing)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-scan:
    name: Build and scan (${{ matrix.arch }})
    if: ${{ !inputs.publish }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify publication history
        run: scripts/check-publication.rb HEAD
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: leani:scan
          build-args: |
            LEANI_GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,scope=container-${{ matrix.arch }},mode=max
      - name: Verify the native image
        run: |
          docker run --rm leani:scan --version
          docker run --rm leani:scan e2e fixture --blocks 128 \
            --data-dir /tmp/leani/fixture --report /tmp/leani/fixture.json
          container=$(docker create leani:scan)
          docker cp "$container:/usr/local/bin/leani" "$RUNNER_TEMP/leani"
          docker cp "$container:/usr/share/licenses/leani" "$RUNNER_TEMP/licenses"
          docker rm "$container"
          ruby scripts/check-artifact-privacy.rb "$RUNNER_TEMP/leani" "$RUNNER_TEMP/licenses"
      - name: Report all high and critical image findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: leani:scan
          format: table
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
      - name: Reject fixable high and critical image findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: leani:scan
          format: table
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Record the verified image dependency inventory
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: leani:scan
          format: cyclonedx
          output: leani-container-${{ matrix.arch }}.cdx.json
      - name: Save the verified image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker image inspect leani:scan --format '{{.Id}}' > image.id
          ruby scripts/check-artifact-privacy.rb "leani-container-$ARCH.cdx.json"
          docker save leani:scan | gzip > "leani-container-$ARCH.tar.gz"
          sha256sum "leani-container-$ARCH.tar.gz" "leani-container-$ARCH.cdx.json" image.id > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leani-container-${{ matrix.arch }}
          path: |
            leani-container-*.tar.gz
            leani-container-*.cdx.json
            image.id
            SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  validate:
    name: Validate image publication
    if: ${{ inputs.publish == true }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify publication history
        run: scripts/check-publication.rb HEAD
      - name: Require a matching release tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          test -n "$CANDIDATE_RUN_ID" || { echo "candidate_run_id is required" >&2; exit 1; }
          case "$IMAGE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "image_tag must be a v-prefixed SemVer" >&2; exit 1 ;;
          esac
          if [ "$GITHUB_REF" != "refs/tags/$IMAGE_TAG" ]; then
            echo "publishing requires dispatching from refs/tags/$IMAGE_TAG" >&2
            exit 1
          fi
          package_version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "leani") | .version')
          if [ "$IMAGE_TAG" != "v$package_version" ]; then
            echo "image tag $IMAGE_TAG does not match leani package version v$package_version" >&2
            exit 1
          fi
      - name: Require passing CI and matching container candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: ruby scripts/check-release-ci.rb --container

  # The only job that can push images or sign attestations. It publishes the
  # images that a successful candidate run built, ran, and scanned, without
  # rebuilding them.
  publish:
    name: Publish immutable GHCR image
    needs: validate
    if: ${{ inputs.publish == true }}
    runs-on: ubuntu-24.04
    environment: release-ghcr
    permissions:
      packages: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: leani-container-*
          path: images
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push verified images and assemble the multiarchitecture tag
        id: push
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          for arch in amd64 arm64; do
            directory="images/leani-container-$arch"
            (cd "$directory" && sha256sum --check SHA256SUMS)
            docker load --input "$directory/leani-container-$arch.tar.gz"
            test "$(docker image inspect leani:scan --format '{{.Id}}')" = "$(cat "$directory/image.id")"
            test "$(docker image inspect leani:scan --format '{{.Architecture}}')" = "$arch"
            docker tag leani:scan "$image:$IMAGE_TAG-$arch"
            docker push "$image:$IMAGE_TAG-$arch"
            docker image inspect "$image:$IMAGE_TAG-$arch" --format '{{index .RepoDigests 0}}' > "$arch.digest"
            echo "$arch-digest=$(cut -d@ -f2 "$arch.digest")" >> "$GITHUB_OUTPUT"
          done
          docker buildx imagetools create --tag "$image:$IMAGE_TAG" \
            "$(cat amd64.digest)" "$(cat arm64.digest)"
          docker buildx imagetools inspect "$image:$IMAGE_TAG"
          index_digest=$(docker buildx imagetools inspect "$image:$IMAGE_TAG" --format '{{json .Manifest}}' | jq -r .digest)
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "index-digest=$index_digest" >> "$GITHUB_OUTPUT"
      # A registry attestation takes exactly one subject, so the index and each
      # architecture's image get their own; either kind of pin can be verified.
      - name: Attest the multiarchitecture image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.index-digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest the amd64 image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.amd64-digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest the arm64 image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.arm64-digest }}
          push-to-registry: true
          create-storage-record: false
      # Attach each image's CycloneDX inventory to its digest; the candidate
      # run's copy expires with its artifacts.
      - name: Attest the amd64 image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.amd64-digest }}
          sbom-path: images/leani-container-amd64/leani-container-amd64.cdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Attest the arm64 image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.arm64-digest }}
          sbom-path: images/leani-container-arm64/leani-container-arm64.cdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Record published digests
        env:
          IMAGE: ${{ steps.push.outputs.image }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          INDEX_DIGEST: ${{ steps.push.outputs.index-digest }}
          AMD64_DIGEST: ${{ steps.push.outputs.amd64-digest }}
          ARM64_DIGEST: ${{ steps.push.outputs.arm64-digest }}
        run: |
          {
            echo "### Published $IMAGE"
            echo
            echo "| Tag | Digest |"
            echo "| --- | --- |"
            echo "| \`$IMAGE_TAG\` (both architectures) | \`$INDEX_DIGEST\` |"
            echo "| \`$IMAGE_TAG-amd64\` | \`$AMD64_DIGEST\` |"
            echo "| \`$IMAGE_TAG-arm64\` | \`$ARM64_DIGEST\` |"
          } >> "$GITHUB_STEP_SUMMARY"
