name: Prepare SDK release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested package to npm
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  package:
    name: Build and inspect npm package
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Verify publication history
        run: ruby ../../scripts/check-publication.rb HEAD
      - name: Require passing release CI
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: ruby ../../scripts/check-release-ci.rb
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Pin npm with trusted publishing support
        run: npm install --global npm@11.19.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: packages/sdk/.bun-version
      - run: bun install --frozen-lockfile
      - run: bun run openapi:check
      - run: bun run typecheck
      - run: bun test
      - run: bun run test:package
      - name: Inspect publish manifest without publishing
        run: npm publish --dry-run --tag next
      - name: Publish with npm provenance
        if: ${{ inputs.publish }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$GITHUB_REF" != "refs/tags/sdk-v$version" ]; then
            echo "publishing requires dispatching from refs/tags/sdk-v$version" >&2
            exit 1
          fi
          case "${version%%+*}" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          npm publish --access public --provenance --tag "$dist_tag"
