name: Prepare SDK release
run-name: ${{ inputs.release_request && format('Prepare SDK release [{0}]', inputs.release_request) || '' }}

on:
  workflow_dispatch:
    inputs:
      container_candidate_run_id:
        description: Successful container preparation run ID (required when publishing)
        required: false
        type: string
      release_request:
        description: Correlation ID used by the release coordinator
        required: false
        type: string
      publish:
        description: Publish the tested package to npm
        required: true
        default: false
        type: boolean
      candidate_run_id:
        description: Successful SDK preparation run ID (optional for standalone publication)
        required: false
        type: string
      bootstrap:
        description: Use NPM_TOKEN for the first publication
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    name: Validate SDK publication
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify publication history
        run: ruby scripts/check-publication.rb HEAD
      - name: Require matching SDK tag and passing release CI
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          CONTAINER_CANDIDATE_RUN_ID: ${{ inputs.container_candidate_run_id }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_WORKFLOW: sdk-release.yml
        run: |
          version=$(ruby -rjson -e 'puts JSON.parse(File.read("packages/sdk/package.json")).fetch("version")')
          test "$GITHUB_REF" = "refs/tags/sdk-v$version" || { echo "dispatch publication from refs/tags/sdk-v$version" >&2; exit 1; }
          ruby scripts/check-release-ci.rb

  package:
    name: Build and inspect npm package
    needs: validate
    if: ${{ !inputs.publish || !inputs.candidate_run_id }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify publication history
        run: ruby ../../scripts/check-publication.rb HEAD
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Pin npm with trusted publishing support
        run: npm install --global npm@11.19.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: packages/sdk/.bun-version
      - run: bun install --frozen-lockfile
      - run: bun run openapi:check
      - run: bun run typecheck
      - run: bun test
      - run: bun run test:package
      - name: Inspect publish manifest without publishing
        run: npm publish --dry-run --tag next
      - name: Prepare and inspect the exact npm archive
        run: |
          mkdir -p "$RUNNER_TEMP/sdk-package" "$RUNNER_TEMP/sdk-unpacked"
          npm pack --pack-destination "$RUNNER_TEMP/sdk-package"
          tar -xzf "$RUNNER_TEMP"/sdk-package/*.tgz -C "$RUNNER_TEMP/sdk-unpacked"
          ruby ../../scripts/check-artifact-privacy.rb "$RUNNER_TEMP/sdk-unpacked"
          # test:package checked its own pack; check the archive to be published.
          # The ${...} below are JavaScript template literals.
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const root = `${process.env.RUNNER_TEMP}/sdk-unpacked/package`;
            const { version } = JSON.parse(readFileSync(`${root}/package.json`, "utf8"));
            const { SDK_VERSION } = await import(`${root}/dist/index.js`);
            if (SDK_VERSION !== version) {
              console.error(`archive SDK_VERSION ${SDK_VERSION} is not package version ${version}`);
              process.exit(1);
            }
          '
          cd "$RUNNER_TEMP/sdk-package"
          sha256sum ./*.tgz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leani-sdk-candidate
          path: ${{ runner.temp }}/sdk-package/
          if-no-files-found: error
          retention-days: 14

  # The only job with an OIDC token or the npm secret. It runs no project
  # code and publishes the archive that the package job tested.
  publish:
    name: Publish tested npm package
    needs: [validate, package]
    if: ${{ always() && inputs.publish && needs.validate.result == 'success' && (needs.package.result == 'success' || (needs.package.result == 'skipped' && inputs.candidate_run_id != '')) }}
    runs-on: ubuntu-24.04
    environment: release-npm
    permissions:
      id-token: write
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: leani-sdk-candidate
          path: ${{ runner.temp }}/sdk-package
          run-id: ${{ inputs.candidate_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Pin npm with trusted publishing support
        run: npm install --global npm@11.19.1
      - name: Publish with npm provenance
        working-directory: ${{ runner.temp }}/sdk-package
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
          NODE_AUTH_TOKEN: ${{ inputs.bootstrap && secrets.NPM_TOKEN || '' }}
        run: |
          if [ "$BOOTSTRAP" = true ] && [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "Configure the bootstrap NPM_TOKEN secret on the release-npm environment" >&2
            exit 1
          fi
          sha256sum --check SHA256SUMS
          set -- ./*.tgz
          test "$#" -eq 1 || { echo "expected exactly one tested npm archive" >&2; exit 1; }
          version=$(tar -xzOf "$1" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          if [ "$GITHUB_REF" != "refs/tags/sdk-v$version" ]; then
            echo "publishing requires dispatching from refs/tags/sdk-v$version" >&2
            exit 1
          fi
          case "${version%%+*}" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          npm publish ./*.tgz --access public --provenance --tag "$dist_tag"
