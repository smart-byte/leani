name: Secret history scan

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Each main commit keeps its own run, which a release of that commit requires.
concurrency:
  group: security-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  publication:
    name: Public tree and history policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/check-publication.rb HEAD
      - name: Test publication guards
        run: ruby scripts/test-publication.rb

  secrets:
    name: Credential history scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned credential scanner
        run: scripts/install-gitleaks.sh .private/tools/bin
      - name: Scan complete reachable history with redacted diagnostics
        run: scripts/check-secrets.sh HEAD
      - name: Test credential detection and fixture exception
        run: ruby scripts/test-secret-scan.rb
