name: Prepare Rust library release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the four processor authoring libraries to crates.io
        required: true
        default: false
        type: boolean
      bootstrap:
        description: Use CARGO_REGISTRY_TOKEN for the first publication
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # The crates.io release surface. Every cargo command below tests,
  # packages, or publishes exactly this selection.
  CRATES: -p leani-primitives -p leani-processor-api -p leani-source-api -p leani-testkit

jobs:
  package:
    name: Verify authoring libraries
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify publication history
        run: ruby scripts/check-publication.rb HEAD
      - name: Require matching release tag and passing CI
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "leani-primitives") | .version')
          test "$GITHUB_REF" = "refs/tags/v$version" || { echo "dispatch publication from refs/tags/v$version" >&2; exit 1; }
          ruby scripts/check-release-ci.rb
      - name: Test authoring libraries
        run: |
          # shellcheck disable=SC2086 # CRATES splits into -p arguments
          cargo test --locked $CRATES
      - name: Verify registry packages without uploading
        run: |
          # shellcheck disable=SC2086 # CRATES splits into -p arguments
          cargo publish --dry-run --locked $CRATES
          python3 scripts/check-crate-packages.py target/package/tmp-registry
          cd target/package/tmp-registry
          sha256sum ./*.crate > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leani-rust-library-candidate
          path: |
            target/package/tmp-registry/*.crate
            target/package/tmp-registry/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  # The only job with an OIDC token or the crates.io secret. Cargo cannot
  # upload a prepared archive, so this job packages the same commit again
  # without compiling and refuses to publish unless every archive is
  # byte-identical to the one the package job tested.
  publish:
    name: Publish verified authoring libraries
    needs: package
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    environment: release-crates
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: leani-rust-library-candidate
          path: ${{ runner.temp }}/crate-candidate
      # The two checksum lists must be equal: the same archive names, as many,
      # with the same bytes. A candidate missing a crate fails here.
      - name: Require the tested archives
        run: |
          (cd "$RUNNER_TEMP/crate-candidate" && sha256sum --check SHA256SUMS)
          # shellcheck disable=SC2086 # CRATES splits into -p arguments
          cargo package --no-verify --locked $CRATES
          (cd target/package && sha256sum ./*.crate) > "$RUNNER_TEMP/packaged.sha256"
          if ! diff "$RUNNER_TEMP/crate-candidate/SHA256SUMS" "$RUNNER_TEMP/packaged.sha256"; then
            echo "the crates to publish differ from the tested candidates" >&2
            exit 1
          fi
      - name: Authenticate with crates.io trusted publishing
        if: ${{ !inputs.bootstrap }}
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - name: Publish verified packages
        env:
          CARGO_REGISTRY_TOKEN: ${{ inputs.bootstrap && secrets.CARGO_REGISTRY_TOKEN || steps.crates-auth.outputs.token }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || { echo "Configure crates.io trusted publishing or the bootstrap CARGO_REGISTRY_TOKEN secret on the release-crates environment" >&2; exit 1; }
          # shellcheck disable=SC2086 # CRATES splits into -p arguments
          cargo publish --no-verify --locked $CRATES
