name: Prepare Rust library release
run-name: Prepare Rust library release${{ inputs.release_request && format(' [{0}]', inputs.release_request) || '' }}

on:
  workflow_dispatch:
    inputs:
      container_candidate_run_id:
        description: Successful container preparation run ID (required when publishing)
        required: false
        type: string
      release_request:
        description: Correlation ID used by the release coordinator
        required: false
        type: string
      publish:
        description: Publish the four processor authoring libraries to crates.io
        required: true
        default: false
        type: boolean
      candidate_run_id:
        description: Successful Rust library preparation run ID (optional for standalone publication)
        required: false
        type: string
      bootstrap:
        description: Use CARGO_REGISTRY_TOKEN for the first publication
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # The crates.io release surface. Every cargo command below tests,
  # packages, or publishes exactly this selection.
  CRATES: -p leani-primitives -p leani-processor-api -p leani-source-api -p leani-testkit

jobs:
  validate:
    name: Validate Rust library publication
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify publication history
        run: ruby scripts/check-publication.rb HEAD
      - name: Read library version and require the release ref
        id: version
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "leani-primitives") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH" = true ]; then
            test "$GITHUB_REF" = "refs/tags/v$version" || { echo "dispatch publication from refs/tags/v$version" >&2; exit 1; }
          fi
      - name: Require passing CI and matching candidates
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          CONTAINER_CANDIDATE_RUN_ID: ${{ inputs.container_candidate_run_id }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_WORKFLOW: crates-release.yml
        run: ruby scripts/check-release-ci.rb

  package:
    name: Verify authoring libraries
    needs: validate
    if: ${{ !inputs.publish || !inputs.candidate_run_id }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify publication history
        run: ruby scripts/check-publication.rb HEAD
      - name: Test authoring libraries
        run: |
          # shellcheck disable=SC2086 # CRATES splits into -p arguments
          cargo test --locked $CRATES
      - name: Verify registry packages without uploading
        run: |
          # shellcheck disable=SC2086 # CRATES splits into -p arguments
          cargo publish --dry-run --locked $CRATES
          python3 scripts/check-crate-packages.py target/package/tmp-registry
          cd target/package/tmp-registry
          sha256sum ./*.crate > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leani-rust-library-candidate
          path: |
            target/package/tmp-registry/*.crate
            target/package/tmp-registry/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  # The only job with an OIDC token or the crates.io secret. Cargo cannot
  # upload a prepared archive, so this job packages the same commit again
  # without compiling and refuses to publish unless every archive is
  # byte-identical to the one the package job tested.
  publish:
    name: Publish verified authoring libraries
    needs: [validate, package]
    if: ${{ always() && inputs.publish && needs.validate.result == 'success' && (needs.package.result == 'success' || (needs.package.result == 'skipped' && inputs.candidate_run_id != '')) }}
    runs-on: ubuntu-24.04
    environment: release-crates
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: leani-rust-library-candidate
          path: ${{ runner.temp }}/crate-candidate
          run-id: ${{ inputs.candidate_run_id || github.run_id }}
          github-token: ${{ github.token }}
      # The two checksum lists must be equal: the same archive names, as many,
      # with the same bytes. A candidate missing a crate fails here.
      - name: Require the tested archives
        run: |
          (cd "$RUNNER_TEMP/crate-candidate" && sha256sum --check SHA256SUMS)
          # shellcheck disable=SC2086 # CRATES splits into -p arguments
          cargo package --no-verify --locked $CRATES
          (cd target/package && sha256sum ./*.crate) > "$RUNNER_TEMP/packaged.sha256"
          if ! diff "$RUNNER_TEMP/crate-candidate/SHA256SUMS" "$RUNNER_TEMP/packaged.sha256"; then
            echo "the crates to publish differ from the tested candidates" >&2
            exit 1
          fi
      - name: Verify previously published crates and select missing packages
        id: inventory
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          packages=$(python3 scripts/coordinate-release.py missing-crates --candidate "$RUNNER_TEMP/crate-candidate" --version "$RELEASE_VERSION")
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
      - name: Authenticate with crates.io trusted publishing
        if: ${{ !inputs.bootstrap && steps.inventory.outputs.packages != '' }}
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - name: Publish verified packages
        if: steps.inventory.outputs.packages != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ inputs.bootstrap && secrets.CARGO_REGISTRY_TOKEN || steps.crates-auth.outputs.token }}
          PACKAGES: ${{ steps.inventory.outputs.packages }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || { echo "Configure crates.io trusted publishing or the bootstrap CARGO_REGISTRY_TOKEN secret on the release-crates environment" >&2; exit 1; }
          # shellcheck disable=SC2086 # verified names split into -p arguments
          cargo publish --no-verify --locked $PACKAGES
