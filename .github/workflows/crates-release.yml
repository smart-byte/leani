name: Prepare Rust library release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the four processor authoring libraries to crates.io
        required: true
        default: false
        type: boolean
      bootstrap:
        description: Use CARGO_REGISTRY_TOKEN for the first publication
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  id-token: write

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  package:
    name: Verify and publish authoring libraries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Verify publication history
        run: ruby scripts/check-publication.rb HEAD
      - name: Require matching release tag and passing CI
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "leani-primitives") | .version')
          test "$GITHUB_REF" = "refs/tags/v$version" || { echo "dispatch publication from refs/tags/v$version" >&2; exit 1; }
          ruby scripts/check-release-ci.rb
      - name: Test authoring libraries
        run: |
          cargo test --locked -p leani-primitives -p leani-processor-api \
            -p leani-source-api -p leani-testkit
      - name: Verify registry packages without uploading
        run: |
          cargo publish --dry-run --locked -p leani-primitives -p leani-processor-api \
            -p leani-source-api -p leani-testkit
          python3 scripts/check-crate-packages.py target/package/tmp-registry
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leani-rust-library-candidate
          path: target/package/tmp-registry/*.crate
          if-no-files-found: error
          retention-days: 14
      - name: Authenticate with crates.io trusted publishing
        if: ${{ inputs.publish && !inputs.bootstrap }}
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - name: Publish verified packages
        if: ${{ inputs.publish }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ inputs.bootstrap && secrets.CARGO_REGISTRY_TOKEN || steps.crates-auth.outputs.token }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || { echo "Configure crates.io trusted publishing or the bootstrap CARGO_REGISTRY_TOKEN secret" >&2; exit 1; }
          cargo publish --locked -p leani-primitives -p leani-processor-api \
            -p leani-source-api -p leani-testkit
